name: Lulu Finity 1.2.1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "build-v1210/**"
      - ".github/workflows/v1210.yml"

permissions:
  contents: write

env:
  BASE_URL: https://github.com/Mikasita25/Lulu-Finity/releases/download/v1.2.0/Lulu-Finity-Source-1.2.0.zip
  BASE_SHA256: 73b3b3a5d3132072cc5b02f97135cdd9556f80dd9e5414cc691d66d69779ef65

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reconstruir y parchear 1.2.1
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error "$BASE_URL" -o base.zip
          echo "$BASE_SHA256  base.zip" | sha256sum --check
          unzip -q base.zip -d app
          python build-v1210/apply-v1210.py app
          python build-v1210/test-v1210.py app
      - name: Validar código y pruebas
        run: |
          set -euo pipefail
          node --check app/src/main.js
          node --check app/src/preload.js
          node --check app/src/renderer.js
          node --check app/src/music-recovery-policy.js
          cd app
          npm ci --ignore-scripts --no-audit --no-fund
          npm test

  windows:
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reconstruir fuente 1.2.1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          Invoke-WebRequest -Uri $env:BASE_URL -OutFile base.zip
          if ((Get-FileHash base.zip -Algorithm SHA256).Hash.ToLower() -ne $env:BASE_SHA256) { throw 'Fuente 1.2.0 incorrecta' }
          Expand-Archive base.zip -DestinationPath app -Force
          python build-v1210/apply-v1210.py app
          python build-v1210/test-v1210.py app
      - name: Crear fuente reproducible
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory source-v1210 -Force | Out-Null
          foreach ($file in @('package.json','package-lock.json','NOTICE.md','README.md','CHANGELOG.md','.gitignore')) {
            if (Test-Path "app/$file") { Copy-Item "app/$file" "source-v1210/$file" -Force }
          }
          foreach ($folder in @('src','resources','build','railway-relay')) {
            if (Test-Path "app/$folder") { Copy-Item "app/$folder" "source-v1210/$folder" -Recurse -Force }
          }
          Compress-Archive -Path 'source-v1210/*' -DestinationPath 'Lulu-Finity-Source-1.2.1.zip' -Force
      - name: Probar y compilar Windows
        working-directory: app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build:win -- --publish never
      - name: Probar arranque real
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $profile = Join-Path $env:RUNNER_TEMP 'lulu-v121-profile'
          $startupMarker = Join-Path $env:RUNNER_TEMP 'lulu-v121-startup.txt'
          $navigationMarker = Join-Path $env:RUNNER_TEMP 'lulu-v121-navigation.json'
          New-Item -ItemType Directory -Path $profile -Force | Out-Null
          Remove-Item $startupMarker,$navigationMarker -Force -ErrorAction SilentlyContinue
          $env:LULU_STARTUP_SMOKE_MARKER = $startupMarker
          $env:LULU_NAVIGATION_SMOKE_MARKER = $navigationMarker
          $executable = Resolve-Path 'app/dist/win-unpacked/Lulu Finity.exe'
          $process = Start-Process -FilePath $executable -ArgumentList "--user-data-dir=$profile" -PassThru
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 120; $attempt++) {
              Start-Sleep -Milliseconds 500
              $process.Refresh()
              if ($process.HasExited) { throw "Lulu Finity se cerró durante la prueba con código $($process.ExitCode)" }
              if ((Test-Path $startupMarker) -and (Test-Path $navigationMarker)) { $ready = $true; break }
            }
            if (!$ready) { throw 'La interfaz no confirmó el arranque completo' }
            if ((Get-Content $startupMarker -Raw).Trim() -ne 'ready') { throw 'Marca de arranque inválida' }
            $navigation = Get-Content $navigationMarker -Raw | ConvertFrom-Json
            if (!$navigation.ok -or @($navigation.results).Count -lt 12) { throw 'La prueba de navegación no pasó' }
          }
          finally {
            Remove-Item Env:LULU_STARTUP_SMOKE_MARKER -ErrorAction SilentlyContinue
            Remove-Item Env:LULU_NAVIGATION_SMOKE_MARKER -ErrorAction SilentlyContinue
            Stop-Process -Name 'Lulu Finity' -Force -ErrorAction SilentlyContinue
          }
      - name: Verificar artefactos del actualizador
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = 'app/dist/Lulu-Finity-Setup-1.2.1.exe'
          $zip = 'app/dist/Lulu-Finity-1.2.1-x64.zip'
          $latest = 'app/dist/latest.yml'
          $blockmap = 'app/dist/Lulu-Finity-Setup-1.2.1.exe.blockmap'
          $source = 'Lulu-Finity-Source-1.2.1.zip'
          foreach ($file in @($installer,$zip,$latest,$blockmap,$source)) {
            if (!(Test-Path $file)) { throw "No se generó $file" }
          }
          $latestText = Get-Content $latest -Raw
          if (!$latestText.Contains('version: 1.2.1')) { throw 'latest.yml no anuncia 1.2.1' }
          if (!$latestText.Contains('Lulu-Finity-Setup-1.2.1.exe')) { throw 'latest.yml no apunta al instalador 1.2.1' }
          Expand-Archive $zip -DestinationPath verify-v121 -Force
          $asar = Get-ChildItem verify-v121 -Recurse -Filter app.asar | Select-Object -First 1
          if (!$asar) { throw 'Falta app.asar' }
          $asarText = [Text.Encoding]::UTF8.GetString([IO.File]::ReadAllBytes($asar.FullName))
          foreach ($token in @('lastPayloadAt','youtubeAdMuteFailsafeTimer','45000, 20000','v1.2.1')) {
            if (!$asarText.Contains($token)) { throw "El paquete no contiene la corrección $token" }
          }
          $files = @($installer,$zip,$latest,$blockmap,$source)
          $lines = foreach ($file in $files) { "{0}  {1}" -f (Get-FileHash $file -Algorithm SHA256).Hash.ToLower(), (Split-Path $file -Leaf) }
          $lines | Set-Content SHA256SUMS.txt -Encoding utf8
      - name: Publicar Lulu Finity 1.2.1
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(
            'app/dist/Lulu-Finity-Setup-1.2.1.exe',
            'app/dist/Lulu-Finity-1.2.1-x64.zip',
            'app/dist/latest.yml',
            'app/dist/Lulu-Finity-Setup-1.2.1.exe.blockmap',
            'Lulu-Finity-Source-1.2.1.zip',
            'SHA256SUMS.txt'
          )
          gh release view v1.2.1 *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload v1.2.1 $files --clobber
            gh release edit v1.2.1 --title 'Lulu Finity 1.2.1' --notes-file 'build-v1210/release-notes.md' --latest
          } else {
            gh release create v1.2.1 $files --target $env:GITHUB_SHA --title 'Lulu Finity 1.2.1' --notes-file 'build-v1210/release-notes.md' --latest
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Lulu-Finity-Windows-v1.2.1
          path: |
            app/dist/Lulu-Finity-Setup-1.2.1.exe
            app/dist/Lulu-Finity-1.2.1-x64.zip
            app/dist/latest.yml
            app/dist/Lulu-Finity-Setup-1.2.1.exe.blockmap
            Lulu-Finity-Source-1.2.1.zip
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
