name: Publicar Lulu Finity 0.21.1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "build-v021/**"
      - "railway-relay/**"
      - ".github/workflows/release-v021.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validar relay de Railway
        working-directory: railway-relay
        run: |
          npm install --no-audit --no-fund
          npm run check
          npm test

      - name: Reconstruir Lulu Finity 0.21.1
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/Mikasita25/Lulu-Finity/releases/download/v0.20.0/Lulu-Finity-Source-0.20.0.zip" -OutFile base.zip
          $baseHash = (Get-FileHash base.zip -Algorithm SHA256).Hash.ToLower()
          if ($baseHash -ne "c9e09583d7a328bff04106a61ef954477651a69d969f421f9ba9d726febc161c") { throw "La fuente 0.20.0 no coincide: $baseHash" }
          Expand-Archive base.zip -DestinationPath app -Force

          $parts = Get-ChildItem "build-v021/script/part-*.txt" | Sort-Object Name
          if ($parts.Count -ne 11) { throw "Se esperaban 11 partes del parche y se encontraron $($parts.Count)." }
          $base64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ""
          [IO.File]::WriteAllText("apply-v021.b64", $base64, [Text.Encoding]::ASCII)
          python -c "import base64,gzip,pathlib; pathlib.Path('apply-v021.py').write_bytes(gzip.decompress(base64.b64decode(pathlib.Path('apply-v021.b64').read_text())))"
          $scriptHash = (Get-FileHash "apply-v021.py" -Algorithm SHA256).Hash.ToLower()
          if ($scriptHash -ne "f03c7320f04c73aa5f3b81582668d3e14a657cd4857d848988e493f1ba948526") { throw "El parche no coincide: $scriptHash" }
          python apply-v021.py app

          node -e "const fs=require('fs');const path='app/package.json';const p=JSON.parse(fs.readFileSync(path,'utf8'));p.version='0.21.1';fs.writeFileSync(path,JSON.stringify(p,null,2)+'\n')"

          $changelog = Get-Content "app/CHANGELOG.md" -Raw
          $entry = "# Cambios`r`n`r`n## 0.21.1`r`n`r`n- Publica una actualización automática para las instalaciones 0.21.0 que no recibieron el token del relay.`r`n- Incluye el token oficial durante la compilación para todos los usuarios.`r`n- Mantiene los ajustes existentes y no requiere desinstalar ni reinstalar Lulu Finity.`r`n- Añade compatibilidad del relay con launchers ya distribuidos y conserva límites por IP y máximo de clientes.`r`n`r`n"
          [IO.File]::WriteAllText("app/CHANGELOG.md", $entry + $changelog, [Text.UTF8Encoding]::new($false))

          node --check app/src/main.js
          node --check app/src/preload.js
          node --check app/src/renderer.js

          $package = Get-Content app/package.json -Raw | ConvertFrom-Json
          if ($package.version -ne "0.21.1") { throw "Versión inesperada: $($package.version)" }
          if ($package.dependencies.ws -ne "8.18.2") { throw "Versión inesperada de ws: $($package.dependencies.ws)" }
          if ($package.build.win.requestedExecutionLevel -ne "asInvoker") { throw "La aplicación solicita administrador." }

          $main = Get-Content app/src/main.js -Raw
          if (!$main.Contains("__LULU_RELAY_CLIENT_TOKEN__")) { throw "Falta el marcador seguro del token." }
          foreach ($token in @("RailwayRelayConnection", "EMBEDDED_RELAY_URL", "EMBEDDED_RELAY_CLIENT_TOKEN", "lulu-finity-production.up.railway.app")) {
            if (!$main.Contains($token)) { throw "Falta $token en main.js" }
          }

          New-Item -ItemType Directory source-v0211 -Force | Out-Null
          foreach ($file in @("package.json", "NOTICE.md", "README.md", "CHANGELOG.md", ".gitignore")) { if (Test-Path "app/$file") { Copy-Item "app/$file" "source-v0211/$file" -Force } }
          foreach ($folder in @("src", "build", ".github")) { if (Test-Path "app/$folder") { Copy-Item "app/$folder" "source-v0211/$folder" -Recurse -Force } }
          Copy-Item "railway-relay" "source-v0211/railway-relay" -Recurse -Force
          Compress-Archive -Path "source-v0211/*" -DestinationPath "Lulu-Finity-Source-0.21.1.zip" -Force

      - name: Inyectar token oficial para todos los usuarios
        shell: pwsh
        env:
          LULU_RELAY_CLIENT_TOKEN: ${{ secrets.LULU_RELAY_CLIENT_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:LULU_RELAY_CLIENT_TOKEN)) {
            throw "Configura el secreto LULU_RELAY_CLIENT_TOKEN en Settings > Secrets and variables > Actions."
          }
          if ($env:LULU_RELAY_CLIENT_TOKEN.Length -lt 32) { throw "LULU_RELAY_CLIENT_TOKEN debe tener al menos 32 caracteres." }
          $path = "app/src/main.js"
          $content = Get-Content $path -Raw
          if (!$content.Contains("__LULU_RELAY_CLIENT_TOKEN__")) { throw "No se encontró el marcador del token." }
          $content = $content.Replace("__LULU_RELAY_CLIENT_TOKEN__", $env:LULU_RELAY_CLIENT_TOKEN)
          [IO.File]::WriteAllText($path, $content, [Text.UTF8Encoding]::new($false))
          if ((Get-Content $path -Raw).Contains("__LULU_RELAY_CLIENT_TOKEN__")) { throw "El token no fue inyectado." }
          node --check $path

      - name: Instalar dependencias
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: Compilar Windows
        working-directory: app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run build:win -- --publish never

      - name: Verificar paquetes
        shell: pwsh
        run: |
          $installer = "app/dist/Lulu-Finity-Setup-0.21.1.exe"
          $zip = "app/dist/Lulu-Finity-0.21.1-x64.zip"
          $latest = "app/dist/latest.yml"
          $blockmap = "app/dist/Lulu-Finity-Setup-0.21.1.exe.blockmap"
          foreach ($file in @($installer, $zip, $latest, $blockmap, "Lulu-Finity-Source-0.21.1.zip")) { if (!(Test-Path $file)) { throw "No se generó $file" } }
          if ((Get-Item $installer).Length -lt 50000000 -or (Get-Item $zip).Length -lt 50000000) { throw "El paquete parece incompleto." }

      - name: Publicar Release 0.21.1
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v0.21.1"
          $files = @("app/dist/Lulu-Finity-Setup-0.21.1.exe", "app/dist/Lulu-Finity-0.21.1-x64.zip", "app/dist/latest.yml", "app/dist/Lulu-Finity-Setup-0.21.1.exe.blockmap", "Lulu-Finity-Source-0.21.1.zip")
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { gh release upload $tag $files --clobber; gh release edit $tag --title "Lulu Finity 0.21.1" --notes-file "app/CHANGELOG.md" }
          else { gh release create $tag $files --target main --title "Lulu Finity 0.21.1" --notes-file "app/CHANGELOG.md" }

      - name: Subir artefacto de Windows
        uses: actions/upload-artifact@v4
        with:
          name: Lulu-Finity-Windows-v0.21.1
          path: |
            app/dist/Lulu-Finity-Setup-0.21.1.exe
            app/dist/Lulu-Finity-0.21.1-x64.zip
            app/dist/latest.yml
            app/dist/Lulu-Finity-Setup-0.21.1.exe.blockmap
            Lulu-Finity-Source-0.21.1.zip
          if-no-files-found: error
          retention-days: 30
