name: Publicar Lulu Finity 0.22.0

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "build-v021/**"
      - "build-v022/**"
      - "railway-relay/**"
      - ".github/workflows/release-v021.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validar relay de Railway
        working-directory: railway-relay
        run: |
          npm install --no-audit --no-fund
          npm run check
          npm test

      - name: Reconstruir Lulu Finity 0.22.0
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/Mikasita25/Lulu-Finity/releases/download/v0.20.0/Lulu-Finity-Source-0.20.0.zip" -OutFile base.zip
          $baseHash = (Get-FileHash base.zip -Algorithm SHA256).Hash.ToLower()
          if ($baseHash -ne "c9e09583d7a328bff04106a61ef954477651a69d969f421f9ba9d726febc161c") { throw "La fuente 0.20.0 no coincide: $baseHash" }
          Expand-Archive base.zip -DestinationPath app -Force

          $parts = Get-ChildItem "build-v021/script/part-*.txt" | Sort-Object Name
          if ($parts.Count -ne 11) { throw "Se esperaban 11 partes del parche 0.21 y se encontraron $($parts.Count)." }
          $base64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ""
          [IO.File]::WriteAllText("apply-v021.b64", $base64, [Text.Encoding]::ASCII)
          python -c "import base64,gzip,pathlib; pathlib.Path('apply-v021.py').write_bytes(gzip.decompress(base64.b64decode(pathlib.Path('apply-v021.b64').read_text())))"
          $scriptHash = (Get-FileHash "apply-v021.py" -Algorithm SHA256).Hash.ToLower()
          if ($scriptHash -ne "f03c7320f04c73aa5f3b81582668d3e14a657cd4857d848988e493f1ba948526") { throw "El parche 0.21 no coincide: $scriptHash" }
          python apply-v021.py app
          python build-v022/apply-v022.py app

          node -e "const fs=require('fs');const path='app/package.json';const p=JSON.parse(fs.readFileSync(path,'utf8'));p.version='0.22.0';fs.writeFileSync(path,JSON.stringify(p,null,2)+'\n')"

          $changelog = Get-Content "app/CHANGELOG.md" -Raw
          $entry = "# Cambios`r`n`r`n## 0.22.0`r`n`r`n- Añade una barra de progreso en Ajustes con el uso diario estimado del relay: 7500 usos y cerca de 2 por conexión.`r`n- Añade bloqueo de anuncios y promociones en el navegador integrado de YouTube.`r`n- Añade los temas Rosa claro, Morado, Rojo y Azul, además de los temas existentes.`r`n- Simplifica el texto de la conexión de TikTok y elimina el mensaje visible de Railway al conectarse.`r`n`r`n"
          [IO.File]::WriteAllText("app/CHANGELOG.md", $entry + $changelog, [Text.UTF8Encoding]::new($false))

          node --check app/src/main.js
          node --check app/src/preload.js
          node --check app/src/renderer.js

          $package = Get-Content app/package.json -Raw | ConvertFrom-Json
          if ($package.version -ne "0.22.0") { throw "Versión inesperada: $($package.version)" }
          if ($package.dependencies.ws -ne "8.18.2") { throw "Versión inesperada de ws: $($package.dependencies.ws)" }
          if ($package.build.win.requestedExecutionLevel -ne "asInvoker") { throw "La aplicación solicita administrador." }

          $main = Get-Content app/src/main.js -Raw
          $preload = Get-Content app/src/preload.js -Raw
          $renderer = Get-Content app/src/renderer.js -Raw
          $html = Get-Content app/src/index.html -Raw
          $styles = Get-Content app/src/styles.css -Raw
          foreach ($token in @("RailwayRelayConnection", "EMBEDDED_RELAY_URL", "EMBEDDED_RELAY_CLIENT_TOKEN", "relay:usage", "youtubeAdBlockEnabled", "YOUTUBE_PARTITION", "Conectado correctamente al LIVE.")) { if (!$main.Contains($token)) { throw "Falta $token en main.js" } }
          foreach ($token in @("getRelayUsage", "youtubeAdBlockEnabledInput", "relayUsageBar", "Rosa claro", "Morado", "Rojo", "Azul", "Lulu ya incluye una conexión estable para leer a TikTok.")) {
            if (!$preload.Contains($token) -and !$renderer.Contains($token) -and !$html.Contains($token)) { throw "Falta $token en la aplicación" }
          }
          foreach ($token in @('data-theme="blush"', 'data-theme="purple"', 'data-theme="red"', 'data-theme="blue"', 'relay-usage-card')) { if (!$styles.Contains($token)) { throw "Falta $token en styles.css" } }
          if ($main.Contains("Conectado mediante Railway")) { throw "El texto visible de Railway sigue presente." }
          if ($html.Contains("Los usuarios no tienen que escribir")) { throw "El texto antiguo de ajustes sigue presente." }
          if (!$main.Contains("__LULU_RELAY_CLIENT_TOKEN__")) { throw "Falta el marcador seguro del token." }

          New-Item -ItemType Directory source-v0220 -Force | Out-Null
          foreach ($file in @("package.json", "NOTICE.md", "README.md", "CHANGELOG.md", ".gitignore")) { if (Test-Path "app/$file") { Copy-Item "app/$file" "source-v0220/$file" -Force } }
          foreach ($folder in @("src", "build", ".github")) { if (Test-Path "app/$folder") { Copy-Item "app/$folder" "source-v0220/$folder" -Recurse -Force } }
          Copy-Item "railway-relay" "source-v0220/railway-relay" -Recurse -Force
          Compress-Archive -Path "source-v0220/*" -DestinationPath "Lulu-Finity-Source-0.22.0.zip" -Force

      - name: Corregir comprobación e inyectar token oficial
        shell: pwsh
        env:
          LULU_RELAY_CLIENT_TOKEN: ${{ secrets.LULU_RELAY_CLIENT_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:LULU_RELAY_CLIENT_TOKEN)) { throw "Configura el secreto LULU_RELAY_CLIENT_TOKEN." }
          if ($env:LULU_RELAY_CLIENT_TOKEN.Length -lt 32) { throw "LULU_RELAY_CLIENT_TOKEN debe tener al menos 32 caracteres." }

          $path = "app/src/main.js"
          $content = Get-Content $path -Raw
          $brokenGuard = "if (!relayClientToken || relayClientToken === '__LULU_RELAY_CLIENT_TOKEN__')"
          $fixedGuard = "if (!relayClientToken || relayClientToken.startsWith('__LULU_RELAY_'))"
          if ($content.Contains($brokenGuard)) { $content = $content.Replace($brokenGuard, $fixedGuard) }
          if (!$content.Contains("__LULU_RELAY_CLIENT_TOKEN__")) { throw "No se encontró el marcador del token." }
          $content = $content.Replace("__LULU_RELAY_CLIENT_TOKEN__", $env:LULU_RELAY_CLIENT_TOKEN)
          [IO.File]::WriteAllText($path, $content, [Text.UTF8Encoding]::new($false))

          $final = Get-Content $path -Raw
          if ($final.Contains("__LULU_RELAY_CLIENT_TOKEN__")) { throw "El token no fue inyectado." }
          if ($final.Contains("relayClientToken ===")) { throw "La comprobación defectuosa sigue presente." }
          if (!$final.Contains("relayClientToken.startsWith('__LULU_RELAY_')")) { throw "No se aplicó la comprobación segura del marcador." }
          node --check $path

      - name: Instalar dependencias
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: Compilar Windows
        working-directory: app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run build:win -- --publish never

      - name: Verificar paquetes y app.asar final
        shell: pwsh
        env:
          LULU_RELAY_CLIENT_TOKEN: ${{ secrets.LULU_RELAY_CLIENT_TOKEN }}
        run: |
          $installer = "app/dist/Lulu-Finity-Setup-0.22.0.exe"
          $zip = "app/dist/Lulu-Finity-0.22.0-x64.zip"
          $latest = "app/dist/latest.yml"
          $blockmap = "app/dist/Lulu-Finity-Setup-0.22.0.exe.blockmap"
          foreach ($file in @($installer, $zip, $latest, $blockmap, "Lulu-Finity-Source-0.22.0.zip")) { if (!(Test-Path $file)) { throw "No se generó $file" } }
          if ((Get-Item $installer).Length -lt 50000000 -or (Get-Item $zip).Length -lt 50000000) { throw "El paquete parece incompleto." }

          Expand-Archive $zip -DestinationPath verify-portable -Force
          $asar = Get-ChildItem verify-portable -Recurse -Filter app.asar | Select-Object -First 1
          if (!$asar) { throw "No se encontró app.asar dentro del ZIP final." }
          $asarText = [Text.Encoding]::UTF8.GetString([IO.File]::ReadAllBytes($asar.FullName))
          foreach ($token in @("relay:usage", "youtubeAdBlockEnabled", "relayUsageBar", "Rosa claro", "Conectado correctamente al LIVE.")) { if (!$asarText.Contains($token)) { throw "El app.asar final no contiene $token" } }
          if ($asarText.Contains("__LULU_RELAY_CLIENT_TOKEN__")) { throw "El ZIP final todavía contiene el marcador sin reemplazar." }
          if ($asarText.Contains("Conectado mediante Railway")) { throw "El ZIP final conserva el texto anterior de Railway." }
          if (!$asarText.Contains($env:LULU_RELAY_CLIENT_TOKEN)) { throw "El ZIP final no contiene el token oficial." }

      - name: Publicar Release 0.22.0
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v0.22.0"
          $files = @("app/dist/Lulu-Finity-Setup-0.22.0.exe", "app/dist/Lulu-Finity-0.22.0-x64.zip", "app/dist/latest.yml", "app/dist/Lulu-Finity-Setup-0.22.0.exe.blockmap", "Lulu-Finity-Source-0.22.0.zip")
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { gh release upload $tag $files --clobber; gh release edit $tag --title "Lulu Finity 0.22.0" --notes-file "app/CHANGELOG.md" }
          else { gh release create $tag $files --target main --title "Lulu Finity 0.22.0" --notes-file "app/CHANGELOG.md" }

      - name: Subir artefacto de Windows
        uses: actions/upload-artifact@v4
        with:
          name: Lulu-Finity-Windows-v0.22.0
          path: |
            app/dist/Lulu-Finity-Setup-0.22.0.exe
            app/dist/Lulu-Finity-0.22.0-x64.zip
            app/dist/latest.yml
            app/dist/Lulu-Finity-Setup-0.22.0.exe.blockmap
            Lulu-Finity-Source-0.22.0.zip
          if-no-files-found: error
          retention-days: 30
