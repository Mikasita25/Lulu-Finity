name: Publicar Lulu Finity 0.28.0

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "build-v028/**"
      - ".github/workflows/release-v028.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar herramienta de parche
        run: python -m pip install --disable-pip-version-check beautifulsoup4

      - name: Reconstruir Lulu Finity 0.28.0
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          Invoke-WebRequest -Uri "https://github.com/Mikasita25/Lulu-Finity/releases/download/v0.27.0/Lulu-Finity-Source-0.27.0.zip" -OutFile base.zip
          $baseHash = (Get-FileHash base.zip -Algorithm SHA256).Hash.ToLower()
          if ($baseHash -ne "1b0b7004a0ba0792dd3e449a7051e56bb34777d79c3d1d6b61c7dfb09aaf9b44") { throw "La fuente 0.27.0 no coincide: $baseHash" }
          Expand-Archive base.zip -DestinationPath app -Force
          python build-v028/apply-v028.py app
          if ($LASTEXITCODE -ne 0) { throw "Falló el parche 0.28.0" }

          node --check app/src/main.js
          node --check app/src/preload.js
          node --check app/src/renderer.js

          Push-Location app/railway-relay
          npm test
          if ($LASTEXITCODE -ne 0) { throw "Fallaron las pruebas del relay incluido." }
          Pop-Location

          $package = Get-Content app/package.json -Raw | ConvertFrom-Json
          if ($package.version -ne "0.28.0") { throw "Versión inesperada: $($package.version)" }
          if ($package.build.win.requestedExecutionLevel -ne "asInvoker") { throw "La aplicación solicita administrador." }

          $html = Get-Content app/src/index.html -Raw
          $main = Get-Content app/src/main.js -Raw
          $renderer = Get-Content app/src/renderer.js -Raw
          $preload = Get-Content app/src/preload.js -Raw

          foreach ($token in @("Anti anuncios de YouTube","Tu uso diario","data-category-tabs=`"songs`"","data-category-tabs=`"settings`"","voiceActivityBars","musicActivityBars","commandActivityBars","setupAudioActivityIndicators","__LULU_AD_STATE__","setYoutubeAdGuardMuted","v0.28.0")) {
            if (!(($html + $main + $renderer).Contains($token))) { throw "Falta $token" }
          }
          if ($html.Contains('data-page="control"') -or $html.Contains('id="page-control"') -or $renderer.Contains('renderControlCenter') -or $renderer.Contains('setupControlCenter')) { throw "Control sigue presente." }
          if ($html.Contains("youtubeUseBraveInput") -or $main.Contains("browser:brave-status") -or $preload.Contains("getBraveStatus")) { throw "La opción de Brave sigue presente." }
          foreach ($token in @("*://*.youtube.com/api/stats/ads*","*://*.youtube.com/pagead/*","*://*.youtube.com/get_midroll_info*")) {
            if ($main.Contains($token)) { throw "El anti anuncios todavía bloquea $token y puede retrasar la reproducción." }
          }
          if (!$main.Contains("__LULU_RELAY_CLIENT_TOKEN__")) { throw "Falta el marcador del token." }
          if ($main.Contains("relayClientToken === '__LULU_RELAY_CLIENT_TOKEN__'")) { throw "Regresó la validación defectuosa del token." }

          New-Item -ItemType Directory source-v028 -Force | Out-Null
          foreach ($file in @("package.json", "NOTICE.md", "README.md", "CHANGELOG.md", ".gitignore")) { if (Test-Path "app/$file") { Copy-Item "app/$file" "source-v028/$file" -Force } }
          foreach ($folder in @("src", "build", "railway-relay")) { if (Test-Path "app/$folder") { Copy-Item "app/$folder" "source-v028/$folder" -Recurse -Force } }
          Compress-Archive -Path "source-v028/*" -DestinationPath "Lulu-Finity-Source-0.28.0.zip" -Force

      - name: Inyectar token oficial del relay
        shell: pwsh
        env:
          LULU_RELAY_CLIENT_TOKEN: ${{ secrets.LULU_RELAY_CLIENT_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:LULU_RELAY_CLIENT_TOKEN)) { throw "Configura LULU_RELAY_CLIENT_TOKEN en GitHub Actions." }
          if ($env:LULU_RELAY_CLIENT_TOKEN.Length -lt 32) { throw "LULU_RELAY_CLIENT_TOKEN debe tener al menos 32 caracteres." }
          $path = "app/src/main.js"
          $content = Get-Content $path -Raw
          if (!$content.Contains("__LULU_RELAY_CLIENT_TOKEN__")) { throw "No se encontró el marcador del token." }
          $content = $content.Replace("__LULU_RELAY_CLIENT_TOKEN__", $env:LULU_RELAY_CLIENT_TOKEN)
          [IO.File]::WriteAllText($path, $content, [Text.UTF8Encoding]::new($false))
          $final = Get-Content $path -Raw
          if ($final.Contains("__LULU_RELAY_CLIENT_TOKEN__")) { throw "El token no fue inyectado." }
          if (!$final.Contains("relayClientToken.startsWith('__LULU_RELAY_')")) { throw "Falta la comprobación segura del marcador." }
          node --check $path

      - name: Instalar dependencias
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: Compilar Windows
        working-directory: app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run build:win -- --publish never

      - name: Verificar paquetes y app.asar final
        shell: pwsh
        env:
          LULU_RELAY_CLIENT_TOKEN: ${{ secrets.LULU_RELAY_CLIENT_TOKEN }}
        run: |
          $installer = "app/dist/Lulu-Finity-Setup-0.28.0.exe"
          $zip = "app/dist/Lulu-Finity-0.28.0-x64.zip"
          $latest = "app/dist/latest.yml"
          $blockmap = "app/dist/Lulu-Finity-Setup-0.28.0.exe.blockmap"
          foreach ($file in @($installer, $zip, $latest, $blockmap, "Lulu-Finity-Source-0.28.0.zip")) { if (!(Test-Path $file)) { throw "No se generó $file" } }
          if ((Get-Item $installer).Length -lt 50000000 -or (Get-Item $zip).Length -lt 50000000) { throw "El paquete parece incompleto." }
          Expand-Archive $zip -DestinationPath verify-portable -Force
          $asar = Get-ChildItem verify-portable -Recurse -Filter app.asar | Select-Object -First 1
          if (!$asar) { throw "No se encontró app.asar dentro del ZIP final." }
          $asarText = [Text.Encoding]::UTF8.GetString([IO.File]::ReadAllBytes($asar.FullName))
          if ($asarText.Contains("__LULU_RELAY_CLIENT_TOKEN__")) { throw "El ZIP final todavía contiene el marcador del token." }
          if (!$asarText.Contains($env:LULU_RELAY_CLIENT_TOKEN)) { throw "El ZIP final no contiene el token oficial." }
          foreach ($token in @("Anti anuncios de YouTube","Tu uso diario","voiceActivityBars","musicActivityBars","commandActivityBars","setupAudioActivityIndicators","__LULU_AD_STATE__","data-category-tabs=`"songs`"","v0.28.0")) {
            if (!$asarText.Contains($token)) { throw "El app.asar final no contiene $token" }
          }
          if ($asarText.Contains('data-page="control"') -or $asarText.Contains('id="page-control"') -or $asarText.Contains('renderControlCenter') -or $asarText.Contains('setupControlCenter')) { throw "El app.asar conserva Control." }
          if ($asarText.Contains("youtubeUseBraveInput") -or $asarText.Contains("browser:brave-status")) { throw "El app.asar conserva Brave." }

      - name: Publicar Release 0.28.0
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v0.28.0"
          $files = @("app/dist/Lulu-Finity-Setup-0.28.0.exe", "app/dist/Lulu-Finity-0.28.0-x64.zip", "app/dist/latest.yml", "app/dist/Lulu-Finity-Setup-0.28.0.exe.blockmap", "Lulu-Finity-Source-0.28.0.zip")
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $files --clobber
            gh release edit $tag --title "Lulu Finity 0.28.0" --notes-file "app/CHANGELOG.md"
          } else {
            gh release create $tag $files --target main --title "Lulu Finity 0.28.0" --notes-file "app/CHANGELOG.md"
          }

      - name: Subir artefacto de Windows
        uses: actions/upload-artifact@v4
        with:
          name: Lulu-Finity-Windows-v0.28.0
          path: |
            app/dist/Lulu-Finity-Setup-0.28.0.exe
            app/dist/Lulu-Finity-0.28.0-x64.zip
            app/dist/latest.yml
            app/dist/Lulu-Finity-Setup-0.28.0.exe.blockmap
            Lulu-Finity-Source-0.28.0.zip
          if-no-files-found: error
          retention-days: 30
