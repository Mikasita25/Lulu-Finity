name: Lulu Finity 0.28.2

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "build-v0282/**"
      - ".github/workflows/v0282.yml"
  push:
    branches: [main]
    paths:
      - "build-v0282/**"
      - ".github/workflows/v0282.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reconstruir 0.28.2
        run: |
          curl --fail --location --silent --show-error https://github.com/Mikasita25/Lulu-Finity/releases/download/v0.28.1/Lulu-Finity-Source-0.28.1.zip --output base.zip
          echo "5e6e63cd4002cb86272915254ecc55005684837249cc74054707f362708b0d44  base.zip" | sha256sum --check
          unzip -q base.zip -d app
          python build-v0282/apply-v0282.py app
      - name: Validar arranque, renderer, Windows y relay
        run: |
          node --check app/src/main.js
          node --check app/src/preload.js
          node --check app/src/renderer.js
          node -e "const p=require('./app/package.json'); if(p.version!=='0.28.2') process.exit(1)"
          python - <<'PY'
          from pathlib import Path
          renderer = Path('app/src/renderer.js').read_text(encoding='utf-8')
          main = Path('app/src/main.js').read_text(encoding='utf-8')
          html = Path('app/src/index.html').read_text(encoding='utf-8')

          required_definitions = (
              'function setupAudioActivityIndicators()',
              'function renderAudioActivityIndicators()',
              'function setEqualizer(id, active)',
              'async function connectFromUi()',
              'async function disconnectFromUi()',
              'async function skipCurrentSong()',
              'function setupEvents()',
          )
          for token in required_definitions:
              assert renderer.count(token) == 1, (token, renderer.count(token))

          init = renderer.index('async function init()')
          audio_def = renderer.index('function setupAudioActivityIndicators()')
          audio_call = renderer.index('  setupAudioActivityIndicators();', init)
          events_def = renderer.index('function setupEvents()')
          events_call = renderer.index('  setupEvents();', init)
          assert audio_def < init < audio_call
          assert events_def < init < events_call

          for token in ('voiceActivityBars','musicActivityBars','commandActivityBars'):
              assert f'id="{token}"' in html, token
          assert '<span class="version" id="versionLabel">v0.28.2</span>' in html
          assert "app.getPath('localAppData')" not in main and 'app.getPath("localAppData")' not in main
          assert 'wss://lulu-finity-production.up.railway.app/v1/tiktok/live' in main
          assert '__LULU_RELAY_CLIENT_TOKEN__' in main
          PY
          cd app/railway-relay && npm test

  release:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reconstruir 0.28.2
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          Invoke-WebRequest -Uri "https://github.com/Mikasita25/Lulu-Finity/releases/download/v0.28.1/Lulu-Finity-Source-0.28.1.zip" -OutFile base.zip
          if ((Get-FileHash base.zip -Algorithm SHA256).Hash.ToLower() -ne "5e6e63cd4002cb86272915254ecc55005684837249cc74054707f362708b0d44") { throw "La fuente 0.28.1 no coincide." }
          Expand-Archive base.zip -DestinationPath app -Force
          python build-v0282/apply-v0282.py app
          node --check app/src/main.js
          node --check app/src/preload.js
          node --check app/src/renderer.js
          Push-Location app/railway-relay; npm test; if ($LASTEXITCODE -ne 0) { throw "Falló el relay." }; Pop-Location
          New-Item -ItemType Directory source-v0282 -Force | Out-Null
          foreach ($file in @("package.json","NOTICE.md","README.md","CHANGELOG.md",".gitignore")) { if (Test-Path "app/$file") { Copy-Item "app/$file" "source-v0282/$file" -Force } }
          foreach ($folder in @("src","build","railway-relay")) { if (Test-Path "app/$folder") { Copy-Item "app/$folder" "source-v0282/$folder" -Recurse -Force } }
          Compress-Archive -Path "source-v0282/*" -DestinationPath "Lulu-Finity-Source-0.28.2.zip" -Force
      - name: Inyectar token oficial del relay
        shell: pwsh
        env:
          LULU_RELAY_CLIENT_TOKEN: ${{ secrets.LULU_RELAY_CLIENT_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:LULU_RELAY_CLIENT_TOKEN) -or $env:LULU_RELAY_CLIENT_TOKEN.Length -lt 32) { throw "LULU_RELAY_CLIENT_TOKEN no está configurado correctamente." }
          $path = "app/src/main.js"
          $content = Get-Content $path -Raw
          if (!$content.Contains("__LULU_RELAY_CLIENT_TOKEN__")) { throw "No se encontró el marcador del token." }
          $content = $content.Replace("__LULU_RELAY_CLIENT_TOKEN__", $env:LULU_RELAY_CLIENT_TOKEN)
          [IO.File]::WriteAllText($path, $content, [Text.UTF8Encoding]::new($false))
          if ((Get-Content $path -Raw).Contains("__LULU_RELAY_CLIENT_TOKEN__")) { throw "El token no fue inyectado." }
          node --check $path
      - name: Compilar Windows
        working-directory: app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          npm install --no-audit --no-fund
          npm run build:win -- --publish never
      - name: Verificar y publicar 0.28.2
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          LULU_RELAY_CLIENT_TOKEN: ${{ secrets.LULU_RELAY_CLIENT_TOKEN }}
        run: |
          $installer = "app/dist/Lulu-Finity-Setup-0.28.2.exe"
          $zip = "app/dist/Lulu-Finity-0.28.2-x64.zip"
          $latest = "app/dist/latest.yml"
          $blockmap = "app/dist/Lulu-Finity-Setup-0.28.2.exe.blockmap"
          foreach ($file in @($installer,$zip,$latest,$blockmap,"Lulu-Finity-Source-0.28.2.zip")) { if (!(Test-Path $file)) { throw "No se generó $file" } }
          Expand-Archive $zip -DestinationPath verify-portable -Force
          $asar = Get-ChildItem verify-portable -Recurse -Filter app.asar | Select-Object -First 1
          if (!$asar) { throw "No se encontró app.asar." }
          $asarText = [Text.Encoding]::UTF8.GetString([IO.File]::ReadAllBytes($asar.FullName))
          foreach ($token in @('function setupAudioActivityIndicators()','function renderAudioActivityIndicators()','async function connectFromUi()','function setupEvents()','v0.28.2')) { if (!$asarText.Contains($token)) { throw "El app.asar final no contiene $token" } }
          if ($asarText.Contains("__LULU_RELAY_CLIENT_TOKEN__") -or !$asarText.Contains($env:LULU_RELAY_CLIENT_TOKEN)) { throw "Token del relay inválido en app.asar." }
          if ($asarText.Contains("app.getPath('localAppData')") -or $asarText.Contains('app.getPath("localAppData")')) { throw "Regresó LocalAppData." }
          $tag = "v0.28.2"
          $files = @($installer,$zip,$latest,$blockmap,"Lulu-Finity-Source-0.28.2.zip")
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { gh release upload $tag $files --clobber; gh release edit $tag --title "Lulu Finity 0.28.2" --notes-file "app/CHANGELOG.md" }
          else { gh release create $tag $files --target main --title "Lulu Finity 0.28.2" --notes-file "app/CHANGELOG.md" }
      - uses: actions/upload-artifact@v4
        with:
          name: Lulu-Finity-Windows-v0.28.2
          path: |
            app/dist/Lulu-Finity-Setup-0.28.2.exe
            app/dist/Lulu-Finity-0.28.2-x64.zip
            app/dist/latest.yml
            app/dist/Lulu-Finity-Setup-0.28.2.exe.blockmap
            Lulu-Finity-Source-0.28.2.zip
          if-no-files-found: error
          retention-days: 30
