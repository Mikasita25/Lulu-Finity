name: Publicar Lulú Finity Mobile Android

on:
  push:
    branches:
      - agent/lulu-finity-mobile-android
    tags:
      - "mobile-v*"
    paths:
      - "mobile/package.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPO_PUBLIC_LULU_RELAY_URL: wss://lulu-finity-production.up.railway.app/v1/tiktok/live
      EXPO_PUBLIC_LULU_RELAY_CLIENT_TOKEN: ${{ secrets.LULU_RELAY_CLIENT_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar acceso al relay
        shell: bash
        run: |
          if [ "${#EXPO_PUBLIC_LULU_RELAY_CLIENT_TOKEN}" -lt 32 ]; then
            echo "LULU_RELAY_CLIENT_TOKEN no está configurado o es inválido."
            exit 1
          fi

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Resolver versión móvil
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./mobile/package.json').version")
          EXPECTED_TAG="mobile-v${VERSION}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "${EXPECTED_TAG}" ]]; then
            echo "El tag ${GITHUB_REF_NAME} no coincide con mobile/package.json (${EXPECTED_TAG})."
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${EXPECTED_TAG}" >> "$GITHUB_OUTPUT"

      - name: Instalar dependencias
        working-directory: mobile
        run: npm ci --no-audit --no-fund

      - name: Validar Expo y TypeScript
        working-directory: mobile
        run: |
          npx expo install --check
          npm run typecheck
          npm run test:realtime
          npm run test:ui
          npm run doctor

      - name: Generar Android
        working-directory: mobile
        run: npx expo prebuild --platform android --clean --no-install

      - name: Compilar APK Release ARM64
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Preparar APK
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cp mobile/android/app/build/outputs/apk/release/app-release.apk "Lulu-Finity-Mobile-Android-${VERSION}.apk"
          test -s "Lulu-Finity-Mobile-Android-${VERSION}.apk"

      - name: Publicar GitHub Release móvil
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          APK="Lulu-Finity-Mobile-Android-${VERSION}.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
            gh release edit "$TAG" --title "Lulú Finity Mobile ${VERSION}" --notes-file mobile/CHANGELOG.md --latest=false
          else
            gh release create "$TAG" "$APK" --target "$GITHUB_SHA" --title "Lulú Finity Mobile ${VERSION}" --notes-file mobile/CHANGELOG.md --latest=false
          fi

      - name: Subir artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lulu-Finity-Mobile-Android-${{ steps.version.outputs.version }}
          path: Lulu-Finity-Mobile-Android-${{ steps.version.outputs.version }}.apk
          if-no-files-found: error
          retention-days: 30
