name: Publicar Lulu Finity 0.9.0

on:
  push:
    branches: [main]
    paths:
      - "build-v9/**"
      - ".github/workflows/release-v81.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Descargar base oficial 0.8.1
        shell: pwsh
        run: |
          $url = "https://github.com/Mikasita25/Lulu-Finity/releases/download/v0.8.1/Lulu-Finity-Source-0.8.1.zip"
          Invoke-WebRequest -Uri $url -OutFile "Lulu-Finity-Source-0.8.1.zip"
          $hash = (Get-FileHash "Lulu-Finity-Source-0.8.1.zip" -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne "2c30542b45340fd8677426be8d9411e43b07a3f5c853c93cb03912607a6d4701") {
            throw "El hash de la base 0.8.1 no coincide: $hash"
          }
          Expand-Archive "Lulu-Finity-Source-0.8.1.zip" -DestinationPath "app" -Force

      - name: Aplicar y validar actualización 0.9.0
        shell: pwsh
        run: ./build-v9/apply.ps1

      - name: Preparar código fuente
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "source-v9" -Force | Out-Null
          foreach ($file in @("package.json", "NOTICE.md", "README.md", "CHANGELOG.md", ".gitignore")) {
            if (Test-Path "app/$file") { Copy-Item "app/$file" "source-v9/$file" -Force }
          }
          foreach ($folder in @("src", "build", ".github")) {
            if (Test-Path "app/$folder") { Copy-Item "app/$folder" "source-v9/$folder" -Recurse -Force }
          }
          Compress-Archive -Path "source-v9/*" -DestinationPath "Lulu-Finity-Source-0.9.0.zip" -Force

      - name: Instalar dependencias
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: Compilar instalador, ZIP y actualizador
        working-directory: app
        run: npm run build:win -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Verificar archivos y analizar con Defender
        shell: pwsh
        run: |
          $installer = "app/dist/Lulu-Finity-Setup-0.9.0.exe"
          $zip = "app/dist/Lulu-Finity-0.9.0-x64.zip"
          $latest = "app/dist/latest.yml"
          $blockmap = "app/dist/Lulu-Finity-Setup-0.9.0.exe.blockmap"
          foreach ($file in @($installer, $zip, $latest, $blockmap, "Lulu-Finity-Source-0.9.0.zip")) {
            if (!(Test-Path $file)) { throw "No se generó $file" }
          }
          if ((Get-Item $installer).Length -lt 50000000) { throw "El instalador parece incompleto." }
          if ((Get-Item $zip).Length -lt 50000000) { throw "El ZIP parece incompleto." }
          try {
            Start-MpScan -ScanType CustomScan -ScanPath (Resolve-Path $installer) -ErrorAction Stop
            Start-MpScan -ScanType CustomScan -ScanPath (Resolve-Path $zip) -ErrorAction Stop
            $recent = Get-MpThreatDetection -ErrorAction SilentlyContinue | Where-Object { $_.InitialDetectionTime -gt (Get-Date).AddMinutes(-15) }
            if ($recent) { throw "Microsoft Defender reportó una detección." }
            Write-Host "Microsoft Defender no reportó detecciones."
          } catch {
            if ($_.Exception.Message -like '*reportó una detección*') { throw }
            Write-Warning "Defender no pudo ejecutarse: $($_.Exception.Message)"
          }

      - name: Publicar Release v0.9.0
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v0.9.0"
          $files = @(
            "app/dist/Lulu-Finity-Setup-0.9.0.exe",
            "app/dist/Lulu-Finity-0.9.0-x64.zip",
            "app/dist/latest.yml",
            "app/dist/Lulu-Finity-Setup-0.9.0.exe.blockmap",
            "Lulu-Finity-Source-0.9.0.zip"
          ) | Where-Object { Test-Path $_ }
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $files --clobber
            gh release edit $tag --title "Lulu Finity 0.9.0" --notes-file "app/CHANGELOG.md"
          } else {
            gh release create $tag $files --target main --title "Lulu Finity 0.9.0" --notes-file "app/CHANGELOG.md"
          }

      - name: Subir artefacto de Windows
        uses: actions/upload-artifact@v4
        with:
          name: Lulu-Finity-Windows-v0.9.0
          path: |
            app/dist/Lulu-Finity-Setup-0.9.0.exe
            app/dist/Lulu-Finity-0.9.0-x64.zip
            app/dist/latest.yml
            app/dist/Lulu-Finity-Setup-0.9.0.exe.blockmap
            Lulu-Finity-Source-0.9.0.zip
          if-no-files-found: error
          retention-days: 30
