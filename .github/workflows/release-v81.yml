name: Publicar Lulu Finity 0.8.1

on:
  push:
    branches: [main]
    paths:
      - "build-v81/delta/**"
      - ".github/workflows/release-v81.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Descargar base oficial 0.8.0
        shell: pwsh
        run: |
          $url = "https://github.com/Mikasita25/Lulu-Finity/releases/download/v0.8.0/Lulu-Finity-Source-0.8.0.zip"
          Invoke-WebRequest -Uri $url -OutFile "Lulu-Finity-Source-0.8.0.zip"
          $hash = (Get-FileHash "Lulu-Finity-Source-0.8.0.zip" -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne "654384609d04edd19af037441be89d61f38c3694456572a890ddbff6b61a4f4c") {
            throw "El hash de la base 0.8.0 no coincide: $hash"
          }
          Expand-Archive "Lulu-Finity-Source-0.8.0.zip" -DestinationPath "app" -Force

      - name: Aplicar arreglo 0.8.1
        shell: pwsh
        run: |
          $parts = Get-ChildItem "build-v81/delta/part-*.txt" | Sort-Object Name
          if ($parts.Count -ne 4) {
            throw "Se esperaban 4 fragmentos y se encontraron $($parts.Count)."
          }
          $encoded = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ""
          [IO.File]::WriteAllBytes("Lulu-Finity-Delta-0.8.1.zip", [Convert]::FromBase64String($encoded))
          $hash = (Get-FileHash "Lulu-Finity-Delta-0.8.1.zip" -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne "226a96a9b22b9547877ac08e412ccc2f3c2d7636324f5e37922a8eef001e8cd9") {
            throw "El hash del arreglo 0.8.1 no coincide: $hash"
          }
          Expand-Archive "Lulu-Finity-Delta-0.8.1.zip" -DestinationPath "app" -Force

      - name: Validar arreglo LocalAppData
        shell: pwsh
        working-directory: app
        run: |
          node --check src/main.js
          node --check src/preload.js
          node --check src/renderer.js
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          if ($package.version -ne "0.8.1") { throw "Versión inesperada: $($package.version)" }
          if ($package.build.win.requestedExecutionLevel -ne "asInvoker") { throw "La aplicación solicita elevación." }
          if ($package.build.nsis.perMachine -ne $false -or $package.build.nsis.allowElevation -ne $false) {
            throw "El instalador no está configurado por usuario."
          }
          $main = Get-Content src/main.js -Raw
          if ($main.Contains("app.getPath('localAppData')") -or $main.Contains('app.getPath("localAppData")')) {
            throw "Todavía existe una llamada incompatible a app.getPath(localAppData)."
          }
          if (!$main.Contains("process.env.LOCALAPPDATA")) {
            throw "Falta la ruta segura LOCALAPPDATA."
          }
          if (!$main.Contains("function isLikelyInstalledBuild")) {
            throw "Falta la detección segura del tipo de instalación."
          }

      - name: Preparar código fuente
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "source-v81" -Force | Out-Null
          foreach ($file in @("package.json", "NOTICE.md", "README.md", "CHANGELOG.md", ".gitignore")) {
            if (Test-Path "app/$file") { Copy-Item "app/$file" "source-v81/$file" -Force }
          }
          foreach ($folder in @("src", "build", ".github")) {
            if (Test-Path "app/$folder") { Copy-Item "app/$folder" "source-v81/$folder" -Recurse -Force }
          }
          Compress-Archive -Path "source-v81/*" -DestinationPath "Lulu-Finity-Source-0.8.1.zip" -Force

      - name: Instalar dependencias
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: Compilar instalador, ZIP y actualizador
        working-directory: app
        run: npm run build:win -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Verificar archivos y analizar con Defender
        shell: pwsh
        run: |
          $installer = "app/dist/Lulu-Finity-Setup-0.8.1.exe"
          $zip = "app/dist/Lulu-Finity-0.8.1-x64.zip"
          $latest = "app/dist/latest.yml"
          $blockmap = "app/dist/Lulu-Finity-Setup-0.8.1.exe.blockmap"
          foreach ($file in @($installer, $zip, $latest, $blockmap, "Lulu-Finity-Source-0.8.1.zip")) {
            if (!(Test-Path $file)) { throw "No se generó $file" }
          }
          if ((Get-Item $installer).Length -lt 50000000) { throw "El instalador parece incompleto." }
          if ((Get-Item $zip).Length -lt 50000000) { throw "El ZIP parece incompleto." }
          try {
            Start-MpScan -ScanType CustomScan -ScanPath (Resolve-Path $installer) -ErrorAction Stop
            Start-MpScan -ScanType CustomScan -ScanPath (Resolve-Path $zip) -ErrorAction Stop
            $recent = Get-MpThreatDetection -ErrorAction SilentlyContinue | Where-Object { $_.InitialDetectionTime -gt (Get-Date).AddMinutes(-15) }
            if ($recent) { throw "Microsoft Defender reportó una detección." }
            Write-Host "Microsoft Defender no reportó detecciones."
          } catch {
            if ($_.Exception.Message -like '*reportó una detección*') { throw }
            Write-Warning "Defender no pudo ejecutarse: $($_.Exception.Message)"
          }

      - name: Publicar Release v0.8.1
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v0.8.1"
          $files = @(
            "app/dist/Lulu-Finity-Setup-0.8.1.exe",
            "app/dist/Lulu-Finity-0.8.1-x64.zip",
            "app/dist/latest.yml",
            "app/dist/Lulu-Finity-Setup-0.8.1.exe.blockmap",
            "Lulu-Finity-Source-0.8.1.zip"
          ) | Where-Object { Test-Path $_ }
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $files --clobber
            gh release edit $tag --title "Lulu Finity 0.8.1" --notes-file "app/CHANGELOG.md"
          } else {
            gh release create $tag $files --target main --title "Lulu Finity 0.8.1" --notes-file "app/CHANGELOG.md"
          }

      - name: Subir artefacto de Windows
        uses: actions/upload-artifact@v4
        with:
          name: Lulu-Finity-Windows-v0.8.1
          path: |
            app/dist/Lulu-Finity-Setup-0.8.1.exe
            app/dist/Lulu-Finity-0.8.1-x64.zip
            app/dist/latest.yml
            app/dist/Lulu-Finity-Setup-0.8.1.exe.blockmap
            Lulu-Finity-Source-0.8.1.zip
          if-no-files-found: error
          retention-days: 30
