name: Elyra Source Snapshot

on:
  push:
    branches:
      - elyra-apk-build
    paths:
      - '.github/workflows/elyra-source-snapshot.yml'

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore current Elyra source
        shell: bash
        run: |
          cat .elyra-build/chunk_00 .elyra-build/chunk_01 .elyra-build/chunk_02 .elyra-build/chunk_03 .elyra-build/chunk_04 .elyra-build/chunk_05 .elyra-build/chunk_06 > /tmp/elyra-project.b64
          base64 -d /tmp/elyra-project.b64 > /tmp/elyra-project.zip
          unzip -q /tmp/elyra-project.zip
          for v in 32 33 34 35; do
            cat .elyra-build/patch${v}_* > /tmp/elyra-v${v}.patch.xz.b64
            base64 -d /tmp/elyra-v${v}.patch.xz.b64 > /tmp/elyra-v${v}.patch.xz
            xz -dc /tmp/elyra-v${v}.patch.xz > /tmp/elyra-v${v}.patch
            patch -p1 < /tmp/elyra-v${v}.patch
          done
          cat .elyra-build/patch36_00 .elyra-build/patch36b_00 .elyra-build/patch36b_01 .elyra-build/patch36c_00 .elyra-build/patch36c_01 .elyra-build/patch36c_02 .elyra-build/patch36c_03 .elyra-build/patch36b_03 .elyra-build/patch36_02 > /tmp/elyra-v36.patch.xz.b64
          base64 -d /tmp/elyra-v36.patch.xz.b64 > /tmp/elyra-v36.patch.xz
          xz -dc /tmp/elyra-v36.patch.xz > /tmp/elyra-v36.patch
          patch -p1 < /tmp/elyra-v36.patch
          printf '\nandroid.useAndroidX=true\n' >> elyra-android/gradle.properties
          tar -czf Elyra-v3.6-source.tar.gz elyra-android

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: Elyra-v3.6-source
          path: Elyra-v3.6-source.tar.gz
          retention-days: 1
