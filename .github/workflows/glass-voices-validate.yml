name: Validar prueba Glass y voces
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'build-glass-voices/**'
      - '.github/workflows/glass-voices-validate.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Descargar y verificar fuente 1.3.3
        run: |
          curl --fail --location --silent --show-error https://github.com/Mikasita25/Lulu-Finity/releases/download/v1.3.3/Lulu-Finity-Source-1.3.3.zip -o base.zip
          echo '845536a984914f0fe692ce1ec679709b17550d398ba006061104a30cb7666c41  base.zip' | sha256sum --check
          unzip -q base.zip -d app
      - name: Aplicar y comprobar
        run: |
          python build-glass-voices/apply.py app
          node --check app/src/main.js
          node --check app/src/renderer.js
          cd app
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
