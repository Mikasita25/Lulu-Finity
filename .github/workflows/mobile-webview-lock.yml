name: Prepare Mobile WebView Lock

on:
  push:
    branches:
      - agent/lulu-finity-mobile-android
    paths:
      - ".github/workflows/mobile-webview-lock.yml"
  pull_request:
    paths:
      - ".github/workflows/mobile-webview-lock.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Generar package.json y lockfile con WebView
        working-directory: mobile
        run: |
          npm install --package-lock-only --save-exact --ignore-scripts --no-audit --no-fund react-native-webview@13.16.1
      - name: Guardar manifiestos en la rama
        if: github.event_name == 'push'
        shell: bash
        run: |
          git config user.name "Alya"
          git config user.email "166329837+Mikasita25@users.noreply.github.com"
          git add -- mobile/package.json mobile/package-lock.json
          if git diff --cached --quiet; then
            echo "Los manifiestos ya estaban actualizados."
          else
            git commit -m "add Expo 57 webview dependency"
            git push origin HEAD:agent/lulu-finity-mobile-android
          fi
      - name: Subir manifiestos
        uses: actions/upload-artifact@v4
        with:
          name: mobile-webview-manifests
          path: |
            mobile/package.json
            mobile/package-lock.json
          if-no-files-found: error
          retention-days: 1
