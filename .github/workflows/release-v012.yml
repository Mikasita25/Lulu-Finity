name: Publicar Lulu Finity 0.12.0

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "build-v012/**"
      - ".github/workflows/release-v012.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reconstruir y validar 0.12.0
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/Mikasita25/Lulu-Finity/releases/download/v0.11.0/Lulu-Finity-Source-0.11.0.zip" -OutFile base.zip
          $baseHash = (Get-FileHash base.zip -Algorithm SHA256).Hash.ToLower()
          if ($baseHash -ne "4c84efab96ac365707f7e9b3c1e40225152c64ba4b688952e729da81cfdd004c") {
            throw "La fuente 0.11.0 no coincide: $baseHash"
          }
          Expand-Archive base.zip -DestinationPath app -Force

          $parts = Get-ChildItem "build-v012/patch/part-*.txt" | Sort-Object Name
          if ($parts.Count -ne 11) { throw "Se esperaban 11 fragmentos y se encontraron $($parts.Count)." }
          $base64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ""
          [IO.File]::WriteAllBytes("Lulu-Finity-Patch-0.12.0.zip", [Convert]::FromBase64String($base64))
          $patchHash = (Get-FileHash "Lulu-Finity-Patch-0.12.0.zip" -Algorithm SHA256).Hash.ToLower()
          if ($patchHash -ne "7ebe31842026a4b4125d6f3b4adf757f4e7ff3f769932f0d65b215eb2e2d5ce7") {
            throw "El parche 0.12.0 no coincide: $patchHash"
          }
          Expand-Archive "Lulu-Finity-Patch-0.12.0.zip" -DestinationPath app -Force

          node --check app/src/main.js
          node --check app/src/preload.js
          node --check app/src/renderer.js

          $package = Get-Content app/package.json -Raw | ConvertFrom-Json
          if ($package.version -ne "0.12.0") { throw "Versión inesperada: $($package.version)" }
          if ($package.build.win.requestedExecutionLevel -ne "asInvoker") { throw "La aplicación solicita administrador." }

          $main = Get-Content app/src/main.js -Raw
          $preload = Get-Content app/src/preload.js -Raw
          $renderer = Get-Content app/src/renderer.js -Raw
          $html = Get-Content app/src/index.html -Raw

          foreach ($token in @("ipcMain.handle('media:pick'", "eventMediaRules", "defaultCommandsDisabledV012", "enabled: false")) {
            if (!$main.Contains($token)) { throw "Falta $token en main.js" }
          }
          foreach ($token in @("pickMedia")) {
            if (!$preload.Contains($token)) { throw "Falta $token en preload.js" }
          }
          foreach ($token in @("dashboardMusicProviderBadge", "command.action === 'sound'", "command.action === 'image'", "runEventMediaRules", "defaultCommandsDisabledV012", "renderDashboardMusic")) {
            if (!$renderer.Contains($token)) { throw "Falta $token en renderer.js" }
          }
          foreach ($token in @("commandMediaField", "commandImageOverlay", "dashboardMusicProviderBadge")) {
            if (!$html.Contains($token)) { throw "Falta $token en index.html" }
          }
          if ($renderer.Contains("!spotify nombre")) { throw "Todavía aparece el comando separado de Spotify." }

          New-Item -ItemType Directory source-v012 -Force | Out-Null
          foreach ($file in @("package.json", "NOTICE.md", "README.md", "CHANGELOG.md", ".gitignore")) {
            if (Test-Path "app/$file") { Copy-Item "app/$file" "source-v012/$file" -Force }
          }
          foreach ($folder in @("src", "build", ".github")) {
            if (Test-Path "app/$folder") { Copy-Item "app/$folder" "source-v012/$folder" -Recurse -Force }
          }
          Compress-Archive -Path "source-v012/*" -DestinationPath "Lulu-Finity-Source-0.12.0.zip" -Force

      - name: Instalar dependencias
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: Compilar Windows
        working-directory: app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run build:win -- --publish never

      - name: Verificar y analizar
        shell: pwsh
        run: |
          $installer = "app/dist/Lulu-Finity-Setup-0.12.0.exe"
          $zip = "app/dist/Lulu-Finity-0.12.0-x64.zip"
          $latest = "app/dist/latest.yml"
          $blockmap = "app/dist/Lulu-Finity-Setup-0.12.0.exe.blockmap"
          foreach ($file in @($installer, $zip, $latest, $blockmap, "Lulu-Finity-Source-0.12.0.zip")) {
            if (!(Test-Path $file)) { throw "No se generó $file" }
          }
          if ((Get-Item $installer).Length -lt 50000000 -or (Get-Item $zip).Length -lt 50000000) {
            throw "El paquete parece incompleto."
          }
          try {
            Start-MpScan -ScanType CustomScan -ScanPath (Resolve-Path $installer) -ErrorAction Stop
            Start-MpScan -ScanType CustomScan -ScanPath (Resolve-Path $zip) -ErrorAction Stop
            $recent = Get-MpThreatDetection -ErrorAction SilentlyContinue | Where-Object { $_.InitialDetectionTime -gt (Get-Date).AddMinutes(-15) }
            if ($recent) { throw "Microsoft Defender reportó una detección." }
          } catch {
            if ($_.Exception.Message -like '*reportó una detección*') { throw }
            Write-Warning $_.Exception.Message
          }

      - name: Publicar Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v0.12.0"
          $files = @(
            "app/dist/Lulu-Finity-Setup-0.12.0.exe",
            "app/dist/Lulu-Finity-0.12.0-x64.zip",
            "app/dist/latest.yml",
            "app/dist/Lulu-Finity-Setup-0.12.0.exe.blockmap",
            "Lulu-Finity-Source-0.12.0.zip"
          )
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $files --clobber
            gh release edit $tag --title "Lulu Finity 0.12.0" --notes-file "app/CHANGELOG.md"
          } else {
            gh release create $tag $files --target main --title "Lulu Finity 0.12.0" --notes-file "app/CHANGELOG.md"
          }

      - name: Subir artefacto de Windows
        uses: actions/upload-artifact@v4
        with:
          name: Lulu-Finity-Windows-v0.12.0
          path: |
            app/dist/Lulu-Finity-Setup-0.12.0.exe
            app/dist/Lulu-Finity-0.12.0-x64.zip
            app/dist/latest.yml
            app/dist/Lulu-Finity-Setup-0.12.0.exe.blockmap
            Lulu-Finity-Source-0.12.0.zip
          if-no-files-found: error
          retention-days: 30
