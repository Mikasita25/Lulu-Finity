name: Lulu Finity 1.3.0

on:
  workflow_dispatch:
  pull_request:
    paths: ["build-v1300/**", ".github/workflows/v1300.yml", "railway-relay/**"]
  push:
    branches: [main]
    paths:
      - "build-v1300/**"
      - ".github/workflows/v1300.yml"

permissions:
  contents: write

env:
  BASE_URL: https://github.com/Mikasita25/Lulu-Finity/releases/download/v1.2.9/Lulu-Finity-Source-1.2.9.zip
  BASE_SHA256: f841d6bef0b9ea1cf83a2857ca173ee26b5bef9390047ad8dbf3b3c23d51cf5f

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reconstruir y parchear 1.3.0
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error "$BASE_URL" -o base.zip
          echo "$BASE_SHA256  base.zip" | sha256sum --check
          unzip -q base.zip -d app
          python build-v1300/apply-v1300.py app
          python build-v1300/test-v1300.py app
      - name: Validar código y pruebas
        run: |
          set -euo pipefail
          node --check app/src/main.js
          node --check app/src/preload.js
          node --check app/src/renderer.js
          node --check app/src/music-recovery-policy.js
          cd app
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          node --test src/speech-start-recovery.test.js src/roulette-action.test.js

  windows:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reconstruir fuente 1.3.0
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          Invoke-WebRequest -Uri $env:BASE_URL -OutFile base.zip
          if ((Get-FileHash base.zip -Algorithm SHA256).Hash.ToLower() -ne $env:BASE_SHA256) { throw 'Fuente 1.2.9 incorrecta' }
          Expand-Archive base.zip -DestinationPath app -Force
          python build-v1300/apply-v1300.py app
          python build-v1300/test-v1300.py app
      - name: Crear fuente reproducible
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory source-v1300 -Force | Out-Null
          foreach ($file in @('package.json','package-lock.json','NOTICE.md','README.md','CHANGELOG.md','.gitignore')) {
            if (Test-Path "app/$file") { Copy-Item "app/$file" "source-v1300/$file" -Force }
          }
          foreach ($folder in @('src','resources','build','railway-relay')) {
            if (Test-Path "app/$folder") { Copy-Item "app/$folder" "source-v1300/$folder" -Recurse -Force }
          }
          $sourceMain = 'source-v1300/src/main.js'
          $sourceContent = Get-Content $sourceMain -Raw
          $prefix = 'const EMBEDDED_RELAY_CLIENT_TOKEN = '
          $start = $sourceContent.IndexOf($prefix)
          if ($start -lt 0) { throw 'Falta la declaración de credencial en el código fuente.' }
          $end = $sourceContent.IndexOf([char]10, $start)
          if ($end -lt 0) { throw 'La declaración está incompleta.' }
          $oldLine = $sourceContent.Substring($start, $end - $start).TrimEnd([char]13)
          $sourceContent = $sourceContent.Replace($oldLine, "const EMBEDDED_RELAY_CLIENT_TOKEN = '__LULU_RELAY_CLIENT_TOKEN__';")
          [IO.File]::WriteAllText($sourceMain, $sourceContent, [Text.UTF8Encoding]::new($false))
          Compress-Archive -Path 'source-v1300/*' -DestinationPath 'Lulu-Finity-Source-1.3.0.zip' -Force
      - name: Incorporar credencial del relay al instalador
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          LULU_RELAY_CLIENT_TOKEN: ${{ secrets.LULU_RELAY_CLIENT_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:LULU_RELAY_CLIENT_TOKEN) -or $env:LULU_RELAY_CLIENT_TOKEN.Length -lt 32) { throw 'Configura LULU_RELAY_CLIENT_TOKEN en GitHub Actions.' }
          $path = 'app/src/main.js'
          $content = Get-Content $path -Raw
          $prefix = 'const EMBEDDED_RELAY_CLIENT_TOKEN = '
          $start = $content.IndexOf($prefix)
          if ($start -lt 0) { throw 'Falta la declaración de credencial en el programa.' }
          $end = $content.IndexOf([char]10, $start)
          if ($end -lt 0) { throw 'La declaración está incompleta.' }
          $oldLine = $content.Substring($start, $end - $start).TrimEnd([char]13)
          $encodedToken = ConvertTo-Json -InputObject $env:LULU_RELAY_CLIENT_TOKEN -Compress
          $replacement = 'const EMBEDDED_RELAY_CLIENT_TOKEN = ' + $encodedToken + ';'
          [IO.File]::WriteAllText($path, $content.Replace($oldLine, $replacement), [Text.UTF8Encoding]::new($false))
      - name: Probar y compilar Windows
        working-directory: app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          npm ci --no-audit --no-fund
          npm test
          node --test src/speech-start-recovery.test.js src/roulette-action.test.js
          npm run build:win -- --publish never
      - name: Probar arranque real
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $profile = Join-Path $env:RUNNER_TEMP 'lulu-v130-profile'
          $startupMarker = Join-Path $env:RUNNER_TEMP 'lulu-v130-startup.txt'
          $navigationMarker = Join-Path $env:RUNNER_TEMP 'lulu-v130-navigation.json'
          New-Item -ItemType Directory -Path $profile -Force | Out-Null
          Remove-Item $startupMarker,$navigationMarker -Force -ErrorAction SilentlyContinue
          $env:LULU_STARTUP_SMOKE_MARKER = $startupMarker
          $env:LULU_NAVIGATION_SMOKE_MARKER = $navigationMarker
          $executable = Resolve-Path 'app/dist/win-unpacked/Lulu Finity.exe'
          $process = Start-Process -FilePath $executable -ArgumentList "--user-data-dir=$profile" -PassThru
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 120; $attempt++) {
              Start-Sleep -Milliseconds 500
              $process.Refresh()
              if ($process.HasExited) { throw "Lulu Finity se cerró durante la prueba con código $($process.ExitCode)" }
              if ((Test-Path $startupMarker) -and (Test-Path $navigationMarker)) { $ready = $true; break }
            }
            if (!$ready) { throw 'La interfaz no confirmó el arranque completo' }
            if ((Get-Content $startupMarker -Raw).Trim() -ne 'ready') { throw 'Marca de arranque inválida' }
            $navigation = Get-Content $navigationMarker -Raw | ConvertFrom-Json
            if (!$navigation.ok -or @($navigation.results).Count -lt 12) { throw 'La prueba de navegación no pasó' }
          }
          finally {
            Remove-Item Env:LULU_STARTUP_SMOKE_MARKER -ErrorAction SilentlyContinue
            Remove-Item Env:LULU_NAVIGATION_SMOKE_MARKER -ErrorAction SilentlyContinue
            Stop-Process -Name 'Lulu Finity' -Force -ErrorAction SilentlyContinue
          }
      - name: Verificar artefactos del actualizador
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = 'app/dist/Lulu-Finity-Setup-1.3.0.exe'
          $zip = 'app/dist/Lulu-Finity-1.3.0-x64.zip'
          $latest = 'app/dist/latest.yml'
          $blockmap = 'app/dist/Lulu-Finity-Setup-1.3.0.exe.blockmap'
          $source = 'Lulu-Finity-Source-1.3.0.zip'
          foreach ($file in @($installer,$zip,$latest,$blockmap,$source)) {
            if (!(Test-Path $file)) { throw "No se generó $file" }
          }
          $latestText = Get-Content $latest -Raw
          if (!$latestText.Contains('version: 1.3.0')) { throw 'latest.yml no anuncia 1.3.0' }
          if (!$latestText.Contains('Lulu-Finity-Setup-1.3.0.exe')) { throw 'latest.yml no apunta al instalador 1.3.0' }
          Expand-Archive $zip -DestinationPath verify-v130 -Force
          $asar = Get-ChildItem verify-v130 -Recurse -Filter app.asar | Select-Object -First 1
          if (!$asar) { throw 'Falta app.asar' }
          $asarText = [Text.Encoding]::UTF8.GetString([IO.File]::ReadAllBytes($asar.FullName))
          if ($env:GITHUB_EVENT_NAME -ne 'pull_request' -and $asarText.Contains('__LULU_RELAY_CLIENT_TOKEN__')) { throw 'El instalador no tiene credencial del relay.' }
          foreach ($token in @('v1.3.0','automation-action-volume-input','automation-action-volume','lastPayloadAt','youtubeAdMuteFailsafeTimer','readCommentIds','markCommentAsRead','wasCommentAlreadyRead','youtubeAdvanceGuardUntil','tiktokGiftCatalog','colorRoulette','showColorRoulette','playColorRoulette','activityExpiresAt','rankingAutoHideInput','data-widget-recall','queueWaitSeconds','queueWaitInput','cola llena; se conservan los comentarios pendientes','systemSpeechRecoveryCancel','withSpeechTimeout','rouletteMedia','rouletteActionFields','scheduleRouletteMedia')) {
            if (!$asarText.Contains($token)) { throw "El paquete no contiene $token" }
          }
          $files = @($installer,$zip,$latest,$blockmap,$source)
          $lines = foreach ($file in $files) { "{0}  {1}" -f (Get-FileHash $file -Algorithm SHA256).Hash.ToLower(), (Split-Path $file -Leaf) }
          $lines | Set-Content SHA256SUMS.txt -Encoding utf8
      - name: Publicar Lulu Finity 1.3.0
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(
            'app/dist/Lulu-Finity-Setup-1.3.0.exe',
            'app/dist/Lulu-Finity-1.3.0-x64.zip',
            'app/dist/latest.yml',
            'app/dist/Lulu-Finity-Setup-1.3.0.exe.blockmap',
            'Lulu-Finity-Source-1.3.0.zip',
            'SHA256SUMS.txt'
          )
          gh release view v1.3.0 *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload v1.3.0 $files --clobber
            gh release edit v1.3.0 --title 'Lulu Finity 1.3.0' --notes-file 'build-v1300/release-notes.md' --latest
          } else {
            gh release create v1.3.0 $files --target $env:GITHUB_SHA --title 'Lulu Finity 1.3.0' --notes-file 'build-v1300/release-notes.md' --latest
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Lulu-Finity-Windows-v1.3.0
          path: |
            app/dist/Lulu-Finity-Setup-1.3.0.exe
            app/dist/Lulu-Finity-1.3.0-x64.zip
            app/dist/latest.yml
            app/dist/Lulu-Finity-Setup-1.3.0.exe.blockmap
            Lulu-Finity-Source-1.3.0.zip
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
