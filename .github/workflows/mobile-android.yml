name: Lulú Finity Mobile Android

on:
  workflow_dispatch:
  push:
    branches:
      - agent/lulu-finity-mobile-android
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-android.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-android.yml"

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_PUBLIC_LULU_RELAY_URL: wss://lulu-finity-production.up.railway.app/v1/tiktok/live
      EXPO_PUBLIC_LULU_RELAY_CLIENT_TOKEN: ${{ secrets.LULU_RELAY_CLIENT_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validar acceso al relay
        shell: bash
        run: |
          if [ "${#EXPO_PUBLIC_LULU_RELAY_CLIENT_TOKEN}" -lt 32 ]; then
            echo "LULU_RELAY_CLIENT_TOKEN no está configurado o es inválido."
            exit 1
          fi
      - name: Comprobar WebSocket LIVE real
        shell: bash
        run: |
          npm ci --prefix "$GITHUB_WORKSPACE/railway-relay" --omit=dev --no-audit --no-fund
          node <<'NODE'
          const WebSocket = require(process.env.GITHUB_WORKSPACE + '/railway-relay/node_modules/ws');
          const token = process.env.EXPO_PUBLIC_LULU_RELAY_CLIENT_TOKEN;
          const url = process.env.EXPO_PUBLIC_LULU_RELAY_URL + '?uniqueId=lulu_finity_probe';
          const ws = new WebSocket(url, {
            headers: {
              Authorization: `Bearer ${token}`,
              'x-lulu-client-token': token,
              'User-Agent': 'Lulu-Finity-Mobile-CI/1.0',
            },
            handshakeTimeout: 15000,
          });
          let opened = false;
          let sawConnecting = false;
          let sawConnected = false;
          const timeout = setTimeout(() => {
            console.error(`LIVE probe timeout. opened=${opened} connecting=${sawConnecting} connected=${sawConnected}`);
            try { ws.terminate(); } catch {}
            process.exit(1);
          }, 25000);
          ws.on('open', () => {
            opened = true;
            console.log('WebSocket LIVE autenticado correctamente.');
          });
          ws.on('message', (data) => {
            let payload;
            try { payload = JSON.parse(data.toString('utf8')); } catch { return; }
            if (payload?.type !== 'lulu.relay.status') return;
            const state = payload?.data?.state;
            if (state === 'connecting' || state === 'rotating') sawConnecting = true;
            if (state === 'connected') {
              sawConnected = true;
              clearTimeout(timeout);
              console.log('Relay LIVE llegó al proveedor upstream correctamente.');
              ws.close(1000, 'ci probe complete');
              setTimeout(() => process.exit(0), 100);
            }
          });
          ws.on('unexpected-response', (_request, response) => {
            clearTimeout(timeout);
            console.error(`Handshake LIVE rechazado con HTTP ${response.statusCode}.`);
            process.exit(1);
          });
          ws.on('close', (code, reason) => {
            if (sawConnected) return;
            clearTimeout(timeout);
            console.error(`LIVE cerró antes de conectar. code=${code} reason=${reason.toString()}`);
            process.exit(1);
          });
          ws.on('error', (error) => {
            if (sawConnected) return;
            console.error('Error WebSocket LIVE:', error.message);
          });
          NODE
      - name: Comprobar audio Microsoft real
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST https://lulu-finity-production.up.railway.app/v1/tts/microsoft \
            --header "Authorization: Bearer $EXPO_PUBLIC_LULU_RELAY_CLIENT_TOKEN" \
            --header "x-lulu-client-token: $EXPO_PUBLIC_LULU_RELAY_CLIENT_TOKEN" \
            --header "content-type: application/json" \
            --header "accept: audio/mpeg" \
            --data '{"text":"Prueba real de Lulú Finity","voice":"es-MX-DaliaNeural","rate":1,"pitch":1}' \
            --output /tmp/lulu-microsoft-test.mp3
          python - <<'PY'
          from pathlib import Path
          audio = Path('/tmp/lulu-microsoft-test.mp3').read_bytes()
          valid = audio.startswith(b'ID3') or (len(audio) > 1 and audio[0] == 0xFF and audio[1] & 0xE0 == 0xE0)
          if len(audio) < 512 or not valid:
              raise SystemExit('El relay no devolvió un MP3 real de Microsoft.')
          print(f'Audio Microsoft verificado: {len(audio)} bytes.')
          PY
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Dependencias
        run: npm ci --prefix "$GITHUB_WORKSPACE/mobile" --no-audit --no-fund
      - name: Alinear parches Expo 57
        run: >-
          npx expo install
          expo@57.0.16
          expo-asset@57.0.14
          expo-audio@57.0.4
          expo-file-system@57.0.5
          expo-notifications@57.0.14
          expo-sharing@57.0.15
          expo-splash-screen@57.0.8
      - name: Validar versiones Expo
        run: npx expo install --check
      - name: TypeScript
        run: npm run typecheck
      - name: Pruebas del LIVE
        run: npm run test:realtime
      - name: Pruebas del relay Microsoft
        run: npm run test:tts-relay
      - name: Pruebas de interfaz móvil
        run: npm run test:ui
      - name: Expo Doctor
        run: npm run doctor
      - name: Generar proyecto Android
        run: npx expo prebuild --platform android --clean --no-install
      - name: Compilar APK Android Release ARM64
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon
      - name: Publicar APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lulu-Finity-Mobile-Android-Release
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
