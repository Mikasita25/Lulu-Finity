name: Lulu native memory diagnostics

on:
  push:
    branches: [desktop/rust-beta]
    paths: [.github/workflows/lulu-memory-diagnostics.yml]

permissions:
  contents: read
  actions: read

jobs:
  diagnostics:
    runs-on: windows-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        installer-run: [44486891912, 44453865710]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Lulu-Finity-Rust-Beta-Windows-x64
          path: ${{ runner.temp }}/lulu-diagnostics-download
          github-token: ${{ github.token }}
          run-id: ${{ matrix.installer-run }}
      - name: Test the exact installed revision
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem (Join-Path $env:RUNNER_TEMP 'lulu-diagnostics-download') -Filter '*.exe' | Select-Object -First 1
          $dir = Join-Path $env:RUNNER_TEMP 'lulu-diagnostics-app'
          $result = Start-Process $installer.FullName -ArgumentList @('/S', "/D=$dir") -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw "Installation failed ($($result.ExitCode))." }
          ./desktop-rust/scripts/test-background.ps1 (Join-Path $dir 'lulu-finity-rust.exe') (Join-Path $env:RUNNER_TEMP 'lulu-diagnostics.json')
