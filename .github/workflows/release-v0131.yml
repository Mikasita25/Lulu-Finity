name: Publicar Lulu Finity 0.13.1

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "build-v0131/**"
      - ".github/workflows/release-v0131.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reconstruir y validar 0.13.1
        shell: pwsh
        env:
          PYTHONUTF8: "1"
        run: |
          Invoke-WebRequest -Uri "https://github.com/Mikasita25/Lulu-Finity/releases/download/v0.13.0/Lulu-Finity-Source-0.13.0.zip" -OutFile base.zip
          $baseHash = (Get-FileHash base.zip -Algorithm SHA256).Hash.ToLower()
          if ($baseHash -ne "5f47d68ef9f60e7912839393385af0006c2ba6d5170b1ca99ca6a0e718b928d7") {
            throw "La fuente 0.13.0 no coincide: $baseHash"
          }
          Expand-Archive base.zip -DestinationPath app -Force

          $scriptHash = (Get-FileHash "build-v0131/apply_patch.py" -Algorithm SHA256).Hash.ToLower()
          $validScriptHashes = @(
            "5ee4e5e90a09897036bb71f6f81ca0ff1df326ba78ccc4ad70db4230ab77cb53",
            "9c69d4fdafbd45403c4c797da94b7db4a47a9daef1cca24b4bccad830410e956"
          )
          if ($scriptHash -notin $validScriptHashes) {
            throw "El parche 0.13.1 no coincide: $scriptHash"
          }
          Copy-Item "build-v0131/apply_patch.py" "app/apply_patch.py" -Force
          Push-Location app
          python apply_patch.py
          Remove-Item apply_patch.py -Force
          Pop-Location

          node --check app/src/main.js
          node --check app/src/preload.js
          node --check app/src/renderer.js

          $package = Get-Content app/package.json -Raw | ConvertFrom-Json
          if ($package.version -ne "0.13.1") { throw "Versión inesperada: $($package.version)" }
          if ($package.build.win.requestedExecutionLevel -ne "asInvoker") { throw "La aplicación solicita administrador." }

          $main = Get-Content app/src/main.js -Raw
          foreach ($token in @(
            "shutdownApplication",
            "destroyAuxiliaryWindows",
            "clearRuntimeAutomation",
            "void shutdownApplication('botón cerrar')",
            "app.on('will-quit'",
            "app.exit(0)"
          )) {
            if (!$main.Contains($token)) { throw "Falta $token en main.js" }
          }
          if ($main.Contains("ipcMain.on('window:close', () => mainWindow?.close())")) {
            throw "Permanece el cierre anterior que dejaba procesos abiertos."
          }

          New-Item -ItemType Directory source-v0131 -Force | Out-Null
          foreach ($file in @("package.json", "NOTICE.md", "README.md", "CHANGELOG.md", ".gitignore")) {
            if (Test-Path "app/$file") { Copy-Item "app/$file" "source-v0131/$file" -Force }
          }
          foreach ($folder in @("src", "build", ".github")) {
            if (Test-Path "app/$folder") { Copy-Item "app/$folder" "source-v0131/$folder" -Recurse -Force }
          }
          Compress-Archive -Path "source-v0131/*" -DestinationPath "Lulu-Finity-Source-0.13.1.zip" -Force

      - name: Instalar dependencias
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: Compilar Windows
        working-directory: app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run build:win -- --publish never

      - name: Verificar y analizar
        shell: pwsh
        run: |
          $installer = "app/dist/Lulu-Finity-Setup-0.13.1.exe"
          $zip = "app/dist/Lulu-Finity-0.13.1-x64.zip"
          $latest = "app/dist/latest.yml"
          $blockmap = "app/dist/Lulu-Finity-Setup-0.13.1.exe.blockmap"
          foreach ($file in @($installer, $zip, $latest, $blockmap, "Lulu-Finity-Source-0.13.1.zip")) {
            if (!(Test-Path $file)) { throw "No se generó $file" }
          }
          if ((Get-Item $installer).Length -lt 50000000 -or (Get-Item $zip).Length -lt 50000000) {
            throw "El paquete parece incompleto."
          }
          try {
            Start-MpScan -ScanType CustomScan -ScanPath (Resolve-Path $installer) -ErrorAction Stop
            Start-MpScan -ScanType CustomScan -ScanPath (Resolve-Path $zip) -ErrorAction Stop
            $recent = Get-MpThreatDetection -ErrorAction SilentlyContinue | Where-Object { $_.InitialDetectionTime -gt (Get-Date).AddMinutes(-15) }
            if ($recent) { throw "Microsoft Defender reportó una detección." }
          } catch {
            if ($_.Exception.Message -like '*reportó una detección*') { throw }
            Write-Warning $_.Exception.Message
          }

      - name: Publicar Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v0.13.1"
          $files = @(
            "app/dist/Lulu-Finity-Setup-0.13.1.exe",
            "app/dist/Lulu-Finity-0.13.1-x64.zip",
            "app/dist/latest.yml",
            "app/dist/Lulu-Finity-Setup-0.13.1.exe.blockmap",
            "Lulu-Finity-Source-0.13.1.zip"
          )
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $files --clobber
            gh release edit $tag --title "Lulu Finity 0.13.1" --notes-file "app/CHANGELOG.md"
          } else {
            gh release create $tag $files --target main --title "Lulu Finity 0.13.1" --notes-file "app/CHANGELOG.md"
          }

      - name: Subir artefacto de Windows
        uses: actions/upload-artifact@v4
        with:
          name: Lulu-Finity-Windows-v0.13.1
          path: |
            app/dist/Lulu-Finity-Setup-0.13.1.exe
            app/dist/Lulu-Finity-0.13.1-x64.zip
            app/dist/latest.yml
            app/dist/Lulu-Finity-Setup-0.13.1.exe.blockmap
            Lulu-Finity-Source-0.13.1.zip
          if-no-files-found: error
          retention-days: 30
