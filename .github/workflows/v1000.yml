name: Lulu Finity 1.0.0

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "build-v1000/**"
      - ".github/workflows/v1000.yml"
  push:
    branches: [main]
    paths:
      - "build-v1000/**"
      - ".github/workflows/v1000.yml"

permissions:
  contents: write

env:
  BASE_URL: https://github.com/Mikasita25/Lulu-Finity/releases/download/v0.34.2/Lulu-Finity-Source-0.34.2.zip
  BASE_SHA256: 7f9e1fa4eb1f28c896e29b2422c5d2dce2f9b4e96c9af16b55175bb97af089fe
  VOICE_URL: https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-es_MX-ald-medium.tar.bz2
  VOICE_SHA256: c60cf7bc853eb01a875fba0756523fecf9d9f46c763b19785d223fc981fb4fb6

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: build-v1000/files/package-lock.json
      - name: Reconstruir Lulu Finity 1.0.0
        run: |
          curl --fail --location --silent --show-error "$BASE_URL" -o base.zip
          echo "$BASE_SHA256  base.zip" | sha256sum --check
          unzip -q base.zip -d app
          python build-v1000/apply-v1000.py app
      - name: Validar sintaxis, interfaz y texto inteligente
        run: |
          node --check app/src/main.js
          node --check app/src/preload.js
          node --check app/src/renderer.js
          node --check app/src/local-voice-manager.js
          node --check app/src/local-tts-worker.js
          python build-v1000/test-v1000.py app
          node --test app/src/text-processor.test.js
          python build-v0342/test-preload-sandbox.py app
          node build-v0320/test-live-games.js app/src/live-games.js
          node build-v0330/test-automation-engine.js app/src/automation-engine.js
      - name: Validar dependencias y relay
        run: |
          cd app
          npm ci --ignore-scripts --no-audit --no-fund
          npm ls adm-zip sherpa-onnx-node @ghostery/adblocker-electron --depth=0
          cd railway-relay
          npm test

  release:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reconstruir fuente 1.0.0
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          Invoke-WebRequest -Uri $env:BASE_URL -OutFile base.zip
          if ((Get-FileHash base.zip -Algorithm SHA256).Hash.ToLower() -ne $env:BASE_SHA256) { throw "Fuente 0.34.2 incorrecta" }
          Expand-Archive base.zip -DestinationPath app -Force
          python build-v1000/apply-v1000.py app
          python build-v1000/test-v1000.py app
      - name: Instalar voz mexicana de Lulu Local
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          Invoke-WebRequest -Uri $env:VOICE_URL -OutFile voice.tar.bz2
          if ((Get-FileHash voice.tar.bz2 -Algorithm SHA256).Hash.ToLower() -ne $env:VOICE_SHA256) { throw "Modelo de voz incorrecto" }
          New-Item -ItemType Directory voice-extracted -Force | Out-Null
          tar -xjf voice.tar.bz2 -C voice-extracted
          $source = "voice-extracted/vits-piper-es_MX-ald-medium"
          $target = "app/resources/voices/lulu-es-mx"
          Copy-Item "$source/*" $target -Recurse -Force
          foreach ($file in @("$target/es_MX-ald-medium.onnx", "$target/tokens.txt", "$target/espeak-ng-data", "$target/MODEL_CARD", "$target/voice.json")) {
            if (!(Test-Path $file)) { throw "Falta $file" }
          }
      - name: Crear fuente reproducible
        shell: pwsh
        run: |
          New-Item -ItemType Directory source-v1000 -Force | Out-Null
          foreach ($file in @("package.json","package-lock.json","NOTICE.md","README.md","CHANGELOG.md",".gitignore")) { if (Test-Path "app/$file") { Copy-Item "app/$file" "source-v1000/$file" -Force } }
          foreach ($folder in @("src","resources","build","railway-relay")) { if (Test-Path "app/$folder") { Copy-Item "app/$folder" "source-v1000/$folder" -Recurse -Force } }
          Compress-Archive -Path "source-v1000/*" -DestinationPath "Lulu-Finity-Source-1.0.0.zip" -Force
      - name: Inyectar token oficial del relay
        shell: pwsh
        env:
          LULU_RELAY_CLIENT_TOKEN: ${{ secrets.LULU_RELAY_CLIENT_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:LULU_RELAY_CLIENT_TOKEN) -or $env:LULU_RELAY_CLIENT_TOKEN.Length -lt 32) { throw "Token inválido" }
          $path = "app/src/main.js"
          $content = Get-Content $path -Raw
          if (!$content.Contains("__LULU_RELAY_CLIENT_TOKEN__")) { throw "Falta marcador" }
          $content = $content.Replace("__LULU_RELAY_CLIENT_TOKEN__", $env:LULU_RELAY_CLIENT_TOKEN)
          [IO.File]::WriteAllText($path, $content, [Text.UTF8Encoding]::new($false))
      - name: Compilar Windows
        working-directory: app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          npm ci --no-audit --no-fund
          npm run build:win -- --publish never
      - name: Verificar y publicar 1.0.0
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          LULU_RELAY_CLIENT_TOKEN: ${{ secrets.LULU_RELAY_CLIENT_TOKEN }}
        run: |
          $installer = "app/dist/Lulu-Finity-Setup-1.0.0.exe"
          $zip = "app/dist/Lulu-Finity-1.0.0-x64.zip"
          $latest = "app/dist/latest.yml"
          $blockmap = "app/dist/Lulu-Finity-Setup-1.0.0.exe.blockmap"
          foreach ($file in @($installer,$zip,$latest,$blockmap,"Lulu-Finity-Source-1.0.0.zip")) { if (!(Test-Path $file)) { throw "No se generó $file" } }
          if (!(Test-Path "app/dist/win-unpacked/resources/lulu-voices/lulu-es-mx/es_MX-ald-medium.onnx")) { throw "La voz local no entró al paquete" }
          Expand-Archive $zip -DestinationPath verify -Force
          $asar = Get-ChildItem verify -Recurse -Filter app.asar | Select-Object -First 1
          if (!$asar) { throw "Falta app.asar" }
          $text = [Text.Encoding]::UTF8.GetString([IO.File]::ReadAllBytes($asar.FullName))
          foreach ($token in @("Lulu Local","featureSearchInput","synthesizeLocalVoice","v1.0.0","runtime:status","text-processor.js")) { if (!$text.Contains($token)) { throw "app.asar no contiene $token" } }
          if ($text.Contains("__LULU_RELAY_CLIENT_TOKEN__") -or !$text.Contains($env:LULU_RELAY_CLIENT_TOKEN)) { throw "Token inválido en asar" }
          $tag = "v1.0.0"
          $files = @($installer,$zip,$latest,$blockmap,"Lulu-Finity-Source-1.0.0.zip")
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { gh release upload $tag $files --clobber; gh release edit $tag --title "Lulu Finity 1.0.0" --notes-file "app/CHANGELOG.md" }
          else { gh release create $tag $files --target main --title "Lulu Finity 1.0.0" --notes-file "app/CHANGELOG.md" }
      - uses: actions/upload-artifact@v4
        with:
          name: Lulu-Finity-Windows-v1.0.0
          path: |
            app/dist/Lulu-Finity-Setup-1.0.0.exe
            app/dist/Lulu-Finity-1.0.0-x64.zip
            app/dist/latest.yml
            app/dist/Lulu-Finity-Setup-1.0.0.exe.blockmap
            Lulu-Finity-Source-1.0.0.zip
          if-no-files-found: error
          retention-days: 30
