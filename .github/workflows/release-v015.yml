name: Publicar Lulu Finity 0.15.0

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "build-v015/**"
      - ".github/workflows/release-v015.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reconstruir y validar 0.15.0
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/Mikasita25/Lulu-Finity/releases/download/v0.14.0/Lulu-Finity-Source-0.14.0.zip" -OutFile base.zip
          $baseHash = (Get-FileHash base.zip -Algorithm SHA256).Hash.ToLower()
          if ($baseHash -ne "3e5e6c9d16d1bc08366f5c446046f1283430a4dde18dbb43bedd452efde0cba6") { throw "La fuente 0.14.0 no coincide: $baseHash" }
          Expand-Archive base.zip -DestinationPath app -Force

          $parts = @(
            "build-v015/script/part-00-0.txt",
            "build-v015/script/part-00-1.txt",
            "build-v015/script/part-00-2.txt",
            "build-v015/script/part-01.txt"
          )
          $base64 = ($parts | ForEach-Object { Get-Content $_ -Raw }) -join ""
          [IO.File]::WriteAllText("apply-v015.b64", $base64, [Text.Encoding]::ASCII)
          python -c "import base64,gzip,pathlib; pathlib.Path('apply-v015.py').write_bytes(gzip.decompress(base64.b64decode(pathlib.Path('apply-v015.b64').read_text())))"
          $scriptHash = (Get-FileHash apply-v015.py -Algorithm SHA256).Hash.ToLower()
          if ($scriptHash -ne "2669cffcc8e1323f7ed9ed04a6cafdcf72a16cd29db68e8bacf706388b47257a") { throw "El parche 0.15.0 no coincide: $scriptHash" }
          Push-Location app
          python ../apply-v015.py
          Pop-Location

          node --check app/src/main.js
          node --check app/src/preload.js
          node --check app/src/renderer.js
          $package = Get-Content app/package.json -Raw | ConvertFrom-Json
          if ($package.version -ne "0.15.0") { throw "Versión inesperada: $($package.version)" }
          if ($package.build.win.requestedExecutionLevel -ne "asInvoker") { throw "La aplicación solicita administrador." }

          $main = Get-Content app/src/main.js -Raw
          $preload = Get-Content app/src/preload.js -Raw
          $renderer = Get-Content app/src/renderer.js -Raw
          $html = Get-Content app/src/index.html -Raw
          foreach ($token in @("startOverlayServer", "showStreamOverlay", "overlay:get-info", "overlay:show", "127.0.0.1", "overlay-media")) { if (!$main.Contains($token)) { throw "Falta $token en main.js" } }
          foreach ($token in @("getOverlayInfo", "copyOverlayUrl", "showOverlay", "onOverlayStatus")) { if (!$preload.Contains($token)) { throw "Falta $token en preload.js" } }
          foreach ($token in @("await api.showOverlay", "refreshOverlayInfo", "overlayScreen", "testStreamOverlay")) { if (!$renderer.Contains($token)) { throw "Falta $token en renderer.js" } }
          foreach ($token in @("Superposición del stream", "overlayUrlOutput", "commandOverlayScreenInput", "Probar imagen/GIF")) { if (!$html.Contains($token)) { throw "Falta $token en index.html" } }
          if ($html.Contains('id="commandImageOverlay"')) { throw "La imagen todavía se muestra sobre la aplicación." }

          New-Item -ItemType Directory source-v015 -Force | Out-Null
          foreach ($file in @("package.json", "NOTICE.md", "README.md", "CHANGELOG.md", ".gitignore")) { if (Test-Path "app/$file") { Copy-Item "app/$file" "source-v015/$file" -Force } }
          foreach ($folder in @("src", "build", ".github")) { if (Test-Path "app/$folder") { Copy-Item "app/$folder" "source-v015/$folder" -Recurse -Force } }
          Compress-Archive -Path "source-v015/*" -DestinationPath "Lulu-Finity-Source-0.15.0.zip" -Force

      - name: Instalar dependencias
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: Compilar Windows
        working-directory: app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run build:win -- --publish never

      - name: Verificar y analizar
        shell: pwsh
        run: |
          $installer = "app/dist/Lulu-Finity-Setup-0.15.0.exe"
          $zip = "app/dist/Lulu-Finity-0.15.0-x64.zip"
          $latest = "app/dist/latest.yml"
          $blockmap = "app/dist/Lulu-Finity-Setup-0.15.0.exe.blockmap"
          foreach ($file in @($installer, $zip, $latest, $blockmap, "Lulu-Finity-Source-0.15.0.zip")) { if (!(Test-Path $file)) { throw "No se generó $file" } }
          if ((Get-Item $installer).Length -lt 50000000 -or (Get-Item $zip).Length -lt 50000000) { throw "El paquete parece incompleto." }
          try {
            Start-MpScan -ScanType CustomScan -ScanPath (Resolve-Path $installer) -ErrorAction Stop
            Start-MpScan -ScanType CustomScan -ScanPath (Resolve-Path $zip) -ErrorAction Stop
            $recent = Get-MpThreatDetection -ErrorAction SilentlyContinue | Where-Object { $_.InitialDetectionTime -gt (Get-Date).AddMinutes(-15) }
            if ($recent) { throw "Microsoft Defender reportó una detección." }
          } catch {
            if ($_.Exception.Message -like '*reportó una detección*') { throw }
            Write-Warning $_.Exception.Message
          }

      - name: Publicar Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v0.15.0"
          $files = @("app/dist/Lulu-Finity-Setup-0.15.0.exe", "app/dist/Lulu-Finity-0.15.0-x64.zip", "app/dist/latest.yml", "app/dist/Lulu-Finity-Setup-0.15.0.exe.blockmap", "Lulu-Finity-Source-0.15.0.zip")
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { gh release upload $tag $files --clobber; gh release edit $tag --title "Lulu Finity 0.15.0" --notes-file "app/CHANGELOG.md" }
          else { gh release create $tag $files --target main --title "Lulu Finity 0.15.0" --notes-file "app/CHANGELOG.md" }

      - name: Subir artefacto de Windows
        uses: actions/upload-artifact@v4
        with:
          name: Lulu-Finity-Windows-v0.15.0
          path: |
            app/dist/Lulu-Finity-Setup-0.15.0.exe
            app/dist/Lulu-Finity-0.15.0-x64.zip
            app/dist/latest.yml
            app/dist/Lulu-Finity-Setup-0.15.0.exe.blockmap
            Lulu-Finity-Source-0.15.0.zip
          if-no-files-found: error
          retention-days: 30
