name: Lulu Finity Rust beta

on:
  workflow_dispatch:
  push:
    branches: [desktop/rust-beta]
    paths:
      - desktop-rust/**
      - .github/workflows/lulu-rust-beta.yml
  pull_request:
    paths:
      - desktop-rust/**
      - .github/workflows/lulu-rust-beta.yml

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: desktop-rust
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.5
          cache: npm
          cache-dependency-path: desktop-rust/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-rust/src-tauri
          cache-on-failure: true
      - run: npm ci
      - name: Compilar el instalador
        run: npm run build:windows -- --target x86_64-pc-windows-msvc
      - name: Validar el puente y las voces locales
        run: npm test
      - name: Probar el instalador y la interfaz en WebView2
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis -Filter '*.exe' | Select-Object -First 1
          if (!$installer) { throw 'No se produjo el instalador.' }
          $installDir = Join-Path $env:RUNNER_TEMP 'lulu-rust-beta'
          $install = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$installDir") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "El instalador devolvió $($install.ExitCode)" }
          $env:LULU_STARTUP_SMOKE_MARKER = Join-Path $env:RUNNER_TEMP 'lulu-rust-startup.txt'
          $env:LULU_NAVIGATION_SMOKE_MARKER = Join-Path $env:RUNNER_TEMP 'lulu-rust-navigation.json'
          $env:LULU_NATIVE_SMOKE_LOG = Join-Path $env:RUNNER_TEMP 'lulu-rust-native.log'
          if (!(Test-Path (Join-Path $installDir 'backend/node.exe'))) { throw 'Falta el motor local en la instalación.' }
          $process = Start-Process (Join-Path $installDir 'lulu-finity-rust.exe') -PassThru
          try {
            $limit = (Get-Date).AddSeconds(100)
            while (!(Test-Path $env:LULU_NAVIGATION_SMOKE_MARKER) -and !$process.HasExited -and (Get-Date) -lt $limit) {
              Start-Sleep -Seconds 1
            }
            if (!(Test-Path $env:LULU_STARTUP_SMOKE_MARKER)) {
              if (Test-Path $env:LULU_NATIVE_SMOKE_LOG) { Get-Content $env:LULU_NATIVE_SMOKE_LOG }
              $backendLog = Join-Path $env:APPDATA 'com.mikasita.lulufinity.rustbeta/backend.log'
              if (Test-Path $backendLog) {
                Get-Content $backendLog -Tail 40
                Copy-Item $backendLog (Join-Path $env:RUNNER_TEMP 'lulu-rust-backend.log')
              }
              throw "El renderer no arrancó. Código del proceso $($process.ExitCode)."
            }
            if (!(Test-Path $env:LULU_NAVIGATION_SMOKE_MARKER)) { throw 'La navegación de la aplicación no terminó.' }
            $navigation = Get-Content $env:LULU_NAVIGATION_SMOKE_MARKER -Raw | ConvertFrom-Json
            if (!$navigation.ok) { $navigation | ConvertTo-Json -Depth 8; throw 'Falló la navegación o alguna vista previa.' }
          } finally {
            if (!$process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Lulu-Finity-Rust-Beta-Windows-x64
          path: desktop-rust/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Lulu-Finity-Rust-Beta-diagnostics
          path: |
            ${{ runner.temp }}/lulu-rust-navigation.json
            ${{ runner.temp }}/lulu-rust-native.log
            ${{ runner.temp }}/lulu-rust-backend.log

  microsoft-online:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    continue-on-error: true
    defaults:
      run:
        working-directory: desktop-rust
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.5
      - run: npm install --no-save --ignore-scripts --no-audit --no-fund msedge-tts@2.1.1
      - name: Probar tres voces del catálogo de Microsoft con audio real
        run: |
          node --input-type=module <<'JS'
          import speech from './scripts/microsoft-speech.cjs';
          const examples = [
            ['es-MX-DaliaNeural', 'Hola. Prueba de Lulu Finity.'],
            ['en-US-AvaMultilingualNeural', 'Hello. Testing Lulu Finity.'],
            ['ja-JP-NanamiNeural', 'こんにちは。音声テストです。']
          ];
          const results = await Promise.allSettled(examples.map(async ([voice, text]) => {
            const audio = await speech.synthesizeMicrosoft({ voice, text, rate: '+0%', pitch: '+0Hz' });
            if (!audio.bytes) throw new Error(voice + ' devolvió audio vacío.');
            console.log(voice, audio.bytes, 'bytes de audio');
          }));
          for (const result of results) if (result.status === 'rejected') { console.error(result.reason?.message || 'La síntesis de Microsoft falló.'); process.exitCode = 1; }
          JS
