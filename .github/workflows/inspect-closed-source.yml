name: Inspect closed-source blocker

on:
  push:
    branches: [agent/closed-source-only]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct current source and report connector fallback
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.29.0 --pattern "Lulu-Finity-Source-0.29.0.zip" --output base.zip
          unzip -q base.zip -d app
          python build-v0320/apply-v0320.py app
          python - <<'PY'
          from pathlib import Path
          path = Path('app/src/main.js')
          lines = path.read_text(encoding='utf-8').splitlines()
          for number in range(3140, min(3241, len(lines) + 1)):
              print(f'{number}: {lines[number-1]}')
          PY
