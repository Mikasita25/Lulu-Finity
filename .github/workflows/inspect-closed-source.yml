name: Inspect closed-source blocker

on:
  push:
    branches: [agent/closed-source-only]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct current source and report relay adapter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.29.0 --pattern "Lulu-Finity-Source-0.29.0.zip" --output base.zip
          unzip -q base.zip -d app
          python build-v0320/apply-v0320.py app
          python - <<'PY'
          from pathlib import Path
          path = Path('app/src/main.js')
          lines = path.read_text(encoding='utf-8').splitlines()
          starts = [i for i,line in enumerate(lines) if 'class RailwayRelayConnection' in line]
          if not starts:
              raise SystemExit('No se encontró RailwayRelayConnection')
          start = max(0, starts[0] - 8)
          end = min(len(lines), starts[0] + 220)
          for i in range(start, end):
              print(f'{i+1}: {lines[i]}')
          PY
