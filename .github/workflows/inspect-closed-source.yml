name: Inspect closed-source blocker

on:
  push:
    branches: [agent/closed-source-only]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct current source and report connector references
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.29.0 --pattern "Lulu-Finity-Source-0.29.0.zip" --output base.zip
          unzip -q base.zip -d app
          python build-v0320/apply-v0320.py app
          python - <<'PY'
          from pathlib import Path
          needles = ('tiktok-live-connector', 'TikTokLiveConnection', 'WebcastPushConnection')
          for file in Path('app/src').glob('*.js'):
              lines = file.read_text(encoding='utf-8').splitlines()
              for number, line in enumerate(lines, 1):
                  if any(needle in line for needle in needles):
                      print(f'{file}:{number}: {line.strip()}')
          PY
