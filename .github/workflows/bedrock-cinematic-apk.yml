name: Build Bedrock Cinematic APK

on:
  push:
    branches:
      - bedrock-cinematic-build
    paths:
      - '.bedrock-build/**'
      - '.github/workflows/bedrock-cinematic-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout temporary build branch
        uses: actions/checkout@v4

      - name: Reconstruct Android project
        shell: bash
        run: |
          set -euo pipefail
          cat .bedrock-build/part*.b64 | tr -d '\n\r' | base64 --decode > /tmp/BedrockCinematicMobile.zip
          mkdir -p /tmp/bedrock-app
          unzip -q /tmp/BedrockCinematicMobile.zip -d /tmp/bedrock-app
          test -f /tmp/bedrock-app/BedrockCinematicMobile/settings.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-37' 'build-tools;36.0.0' 'platform-tools'

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build debug APK
        working-directory: /tmp/bedrock-app/BedrockCinematicMobile
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          APK=/tmp/bedrock-app/BedrockCinematicMobile/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/BedrockCinematicBuilder.apk"
          ls -lh "$GITHUB_WORKSPACE/BedrockCinematicBuilder.apk"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: BedrockCinematicBuilder-APK
          path: BedrockCinematicBuilder.apk
          if-no-files-found: error
          retention-days: 7
