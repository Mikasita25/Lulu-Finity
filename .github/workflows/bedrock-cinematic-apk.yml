name: Build Bedrock Cinematic APK

on:
  push:
    branches:
      - bedrock-cinematic-build
    paths:
      - '.bedrock-build/part00.b64'
      - '.bedrock-build/part01.b64'
      - '.bedrock-build/part02.b64'
      - '.bedrock-build/part03.b64'
      - '.bedrock-build/part04.b64'
      - '.bedrock-build/part05.b64'
      - '.github/workflows/bedrock-cinematic-apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout temporary build branch
        uses: actions/checkout@v4

      - name: Record workflow run ID
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$GITHUB_RUN_ID" > .bedrock-build/run_id.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .bedrock-build/run_id.txt
          git commit -m 'Record Bedrock APK workflow run' || true
          git push origin HEAD:bedrock-cinematic-build

      - name: Reconstruct Android project
        shell: bash
        run: |
          set -euo pipefail
          cat .bedrock-build/part*.b64 | tr -d '\n\r' | base64 --decode > /tmp/BedrockCinematicMobile.zip
          mkdir -p /tmp/bedrock-app
          unzip -q /tmp/BedrockCinematicMobile.zip -d /tmp/bedrock-app
          test -f /tmp/bedrock-app/BedrockCinematicMobile/settings.gradle.kts
          sed -i 's/compileSdk = 37/compileSdk = 36/' /tmp/bedrock-app/BedrockCinematicMobile/app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build debug APK
        working-directory: /tmp/bedrock-app/BedrockCinematicMobile
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          APK=/tmp/bedrock-app/BedrockCinematicMobile/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/BedrockCinematicBuilder.apk"
          unzip -t "$GITHUB_WORKSPACE/BedrockCinematicBuilder.apk" >/dev/null
          ls -lh "$GITHUB_WORKSPACE/BedrockCinematicBuilder.apk"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: BedrockCinematicBuilder-APK
          path: BedrockCinematicBuilder.apk
          if-no-files-found: error
          retention-days: 7
