name: Elyra APK Builder

on:
  push:
    branches:
      - elyra-apk-build
    paths:
      - '.github/workflows/elyra-apk-build.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Android project
        shell: bash
        run: |
          cat .elyra-build/chunk_00 .elyra-build/chunk_01 .elyra-build/chunk_02 .elyra-build/chunk_03 .elyra-build/chunk_04 .elyra-build/chunk_05 .elyra-build/chunk_06 > /tmp/elyra-project.b64
          base64 -d /tmp/elyra-project.b64 > /tmp/elyra-project.zip
          unzip -q /tmp/elyra-project.zip
          cat .elyra-build/patch32_* > /tmp/elyra-v32.patch.xz.b64
          base64 -d /tmp/elyra-v32.patch.xz.b64 > /tmp/elyra-v32.patch.xz
          echo '757844890b10f078877207c6763302e64245b648de33b8e69edbbf46a743fdc9  /tmp/elyra-v32.patch.xz' | sha256sum -c -
          xz -dc /tmp/elyra-v32.patch.xz > /tmp/elyra-v32.patch
          patch -p1 < /tmp/elyra-v32.patch
          test -f elyra-android/app/build.gradle
          test -f elyra-android/app/src/main/java/com/elyra/ai/MainActivity.java
          test -f elyra-android/app/src/main/java/com/elyra/ai/LocalModelEngine.kt
          grep -q "llama-android:0.1.1" elyra-android/app/build.gradle
          grep -q "Qwen3-1.7B-Q4_K_M.gguf" elyra-android/app/src/main/java/com/elyra/ai/LocalModelEngine.kt

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        shell: bash
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        working-directory: elyra-android
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify native engine
        shell: bash
        run: |
          test -f elyra-android/app/build/outputs/apk/debug/app-debug.apk
          unzip -l elyra-android/app/build/outputs/apk/debug/app-debug.apk | grep -q 'lib/arm64-v8a/'

      - name: Prepare APK
        run: cp elyra-android/app/build/outputs/apk/debug/app-debug.apk Elyra-AI-v3.2.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Elyra-AI-v3.2
          path: Elyra-AI-v3.2.apk
          retention-days: 1
