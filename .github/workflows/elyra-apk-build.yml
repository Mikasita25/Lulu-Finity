name: Elyra APK Builder

on:
  push:
    branches:
      - elyra-apk-build
    paths:
      - '.github/workflows/elyra-apk-build.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Android project
        shell: bash
        run: |
          cat .elyra-build/chunk_00 .elyra-build/chunk_01 .elyra-build/chunk_02 .elyra-build/chunk_03 .elyra-build/chunk_04 .elyra-build/chunk_05 .elyra-build/chunk_06 > /tmp/elyra-project.b64
          base64 -d /tmp/elyra-project.b64 > /tmp/elyra-project.zip
          unzip -q /tmp/elyra-project.zip
          cat .elyra-build/patch32_* > /tmp/elyra-v32.patch.xz.b64
          base64 -d /tmp/elyra-v32.patch.xz.b64 > /tmp/elyra-v32.patch.xz
          echo '757844890b10f078877207c6763302e64245b648de33b8e69edbbf46a743fdc9  /tmp/elyra-v32.patch.xz' | sha256sum -c -
          xz -dc /tmp/elyra-v32.patch.xz > /tmp/elyra-v32.patch
          patch -p1 < /tmp/elyra-v32.patch
          cat .elyra-build/patch33_* > /tmp/elyra-v33.patch.xz.b64
          base64 -d /tmp/elyra-v33.patch.xz.b64 > /tmp/elyra-v33.patch.xz
          echo '6dcc88ea5d7074c4c95396c4ae4e1dd2663f2fe9189d19351d9fd611a043710d  /tmp/elyra-v33.patch.xz' | sha256sum -c -
          xz -dc /tmp/elyra-v33.patch.xz > /tmp/elyra-v33.patch
          patch -p1 < /tmp/elyra-v33.patch
          cat .elyra-build/patch34_* > /tmp/elyra-v34.patch.xz.b64
          base64 -d /tmp/elyra-v34.patch.xz.b64 > /tmp/elyra-v34.patch.xz
          echo '5c1c48a77adaae63d71789e76b9e27478fcc433e23b67ab9638254f119c3c6c2  /tmp/elyra-v34.patch.xz' | sha256sum -c -
          xz -dc /tmp/elyra-v34.patch.xz > /tmp/elyra-v34.patch
          patch -p1 < /tmp/elyra-v34.patch
          printf '\nandroid.useAndroidX=true\n' >> elyra-android/gradle.properties
          test -f elyra-android/app/build.gradle
          test -f elyra-android/app/src/main/java/com/elyra/ai/MainActivity.java
          test -f elyra-android/app/src/main/java/com/elyra/ai/LocalModelEngine.kt
          grep -q "litertlm-android:0.15.0" elyra-android/app/build.gradle
          grep -q "Qwen2_0.5B_Instruct.litertlm" elyra-android/app/src/main/java/com/elyra/ai/LocalModelEngine.kt
          grep -q "__elyraNativeModelToken" elyra-android/app/src/main/assets/app.js
          grep -q "__elyraHandleAndroidBack" elyra-android/app/src/main/assets/app.js
          grep -q "setOnApplyWindowInsetsListener" elyra-android/app/src/main/java/com/elyra/ai/MainActivity.java
          grep -q "android.useAndroidX=true" elyra-android/gradle.properties

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        shell: bash
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        working-directory: elyra-android
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify turbo engine
        shell: bash
        run: |
          test -f elyra-android/app/build/outputs/apk/debug/app-debug.apk
          unzip -l elyra-android/app/build/outputs/apk/debug/app-debug.apk | grep -q 'lib/arm64-v8a/'
          unzip -p elyra-android/app/build/outputs/apk/debug/app-debug.apk assets/app.js | grep -q '__elyraNativeModelToken'

      - name: Prepare APK
        run: cp elyra-android/app/build/outputs/apk/debug/app-debug.apk Elyra-AI-v3.4.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Elyra-AI-v3.4
          path: Elyra-AI-v3.4.apk
          retention-days: 1
