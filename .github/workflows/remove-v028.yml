name: Retirar Lulu Finity 0.28.0

on:
  push:
    paths:
      - ".github/workflows/remove-v028.yml"

permissions:
  contents: write

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - name: Retirar release y tag 0.28.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh release delete v0.28.0 --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          if gh release view v0.28.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "La release v0.28.0 sigue existiendo"
            exit 1
          fi
