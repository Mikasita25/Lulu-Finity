name: Lulu Finity user and queue regression checks

on:
  pull_request:
    paths: ["build-v1270/**", ".github/workflows/v1270-validate.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reconstruct released source and apply fixes
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error https://github.com/Mikasita25/Lulu-Finity/releases/download/v1.2.6/Lulu-Finity-Source-1.2.6.zip -o base.zip
          echo 'a80b1ad8027a67b4506b32ca1366e79bc907c59945c8b7f0cc0be36c499afae0  base.zip' | sha256sum --check
          unzip -q base.zip -d app
          python build-v1270/apply-v1270.py app
      - name: Validate application and regressions
        working-directory: app
        run: |
          node --check src/main.js
          node --check src/renderer.js
          node --check src/relay-protocol.js
          node --check src/text-processor.js
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
