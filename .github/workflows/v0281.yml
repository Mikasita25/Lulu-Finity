name: Lulu Finity 0.28.1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "build-v0281/**"
      - ".github/workflows/v0281.yml"
  push:
    branches: [main]
    paths:
      - "build-v0281/**"
      - ".github/workflows/v0281.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reconstruir 0.28.1
        run: |
          curl --fail --location --silent --show-error https://github.com/Mikasita25/Lulu-Finity/releases/download/v0.28.0/Lulu-Finity-Source-0.28.0.zip --output base.zip
          echo "2757db60e61c31a17e042b8a77874bde6062e5d950ef322e2bce2636661cb548  base.zip" | sha256sum --check
          unzip -q base.zip -d app
          python build-v0281/apply-v0281.py app
      - name: Validar renderer, Windows y relay
        run: |
          node --check app/src/main.js
          node --check app/src/preload.js
          node --check app/src/renderer.js
          node -e "const p=require('./app/package.json'); if(p.version!=='0.28.1') process.exit(1)"
          python - <<'PY'
          from pathlib import Path
          renderer = Path('app/src/renderer.js').read_text(encoding='utf-8')
          main = Path('app/src/main.js').read_text(encoding='utf-8')
          html = Path('app/src/index.html').read_text(encoding='utf-8')
          for token in (
              'async function connectFromUi()', 'async function disconnectFromUi()',
              'async function addManualSong(inputId)', 'async function skipCurrentSong()',
              'function syncRecommendedSetting(value)', 'function setupEvents()',
              "$('connectBtn').addEventListener('click', connectFromUi);",
              "$('disconnectBtn').addEventListener('click', disconnectFromUi);",
              "$('songsSkipBtn').addEventListener('click', skipCurrentSong);", 'setupEvents();'):
              assert token in renderer, token
          nav = renderer.index('function setupNavigation()')
          connect = renderer.index('async function connectFromUi()', nav)
          events = renderer.index('function setupEvents()', connect)
          prefix = renderer.index("$('songPrefixInput').addEventListener", events)
          init = renderer.index('async function init()')
          assert nav < connect < events < prefix < init
          assert renderer.count('function setupEvents()') == 1
          assert renderer.count('async function connectFromUi()') == 1
          assert renderer.count('async function skipCurrentSong()') == 1
          assert "app.getPath('localAppData')" not in main and 'app.getPath("localAppData")' not in main
          assert 'wss://lulu-finity-production.up.railway.app/v1/tiktok/live' in main
          assert '__LULU_RELAY_CLIENT_TOKEN__' in main
          assert 'youtubeUseBraveInput' not in html and 'browser:brave-status' not in main
          assert '<span class="version" id="versionLabel">v0.28.1</span>' in html
          assert 'data-page="control"' not in html
          PY
          cd app/railway-relay && npm test

  release:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reconstruir 0.28.1
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          Invoke-WebRequest -Uri "https://github.com/Mikasita25/Lulu-Finity/releases/download/v0.28.0/Lulu-Finity-Source-0.28.0.zip" -OutFile base.zip
          if ((Get-FileHash base.zip -Algorithm SHA256).Hash.ToLower() -ne "2757db60e61c31a17e042b8a77874bde6062e5d950ef322e2bce2636661cb548") { throw "La fuente 0.28.0 no coincide." }
          Expand-Archive base.zip -DestinationPath app -Force
          python build-v0281/apply-v0281.py app
          node --check app/src/main.js
          node --check app/src/preload.js
          node --check app/src/renderer.js
          Push-Location app/railway-relay; npm test; if ($LASTEXITCODE -ne 0) { throw "Falló el relay." }; Pop-Location
          New-Item -ItemType Directory source-v0281 -Force | Out-Null
          foreach ($file in @("package.json","NOTICE.md","README.md","CHANGELOG.md",".gitignore")) { if (Test-Path "app/$file") { Copy-Item "app/$file" "source-v0281/$file" -Force } }
          foreach ($folder in @("src","build","railway-relay")) { if (Test-Path "app/$folder") { Copy-Item "app/$folder" "source-v0281/$folder" -Recurse -Force } }
          Compress-Archive -Path "source-v0281/*" -DestinationPath "Lulu-Finity-Source-0.28.1.zip" -Force
      - name: Inyectar token oficial del relay
        shell: pwsh
        env:
          LULU_RELAY_CLIENT_TOKEN: ${{ secrets.LULU_RELAY_CLIENT_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:LULU_RELAY_CLIENT_TOKEN) -or $env:LULU_RELAY_CLIENT_TOKEN.Length -lt 32) { throw "LULU_RELAY_CLIENT_TOKEN no está configurado correctamente." }
          $path = "app/src/main.js"
          $content = Get-Content $path -Raw
          if (!$content.Contains("__LULU_RELAY_CLIENT_TOKEN__")) { throw "No se encontró el marcador del token." }
          $content = $content.Replace("__LULU_RELAY_CLIENT_TOKEN__", $env:LULU_RELAY_CLIENT_TOKEN)
          [IO.File]::WriteAllText($path, $content, [Text.UTF8Encoding]::new($false))
          if ((Get-Content $path -Raw).Contains("__LULU_RELAY_CLIENT_TOKEN__")) { throw "El token no fue inyectado." }
          node --check $path
      - name: Compilar Windows
        working-directory: app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          npm install --no-audit --no-fund
          npm run build:win -- --publish never
      - name: Verificar y publicar 0.28.1
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          LULU_RELAY_CLIENT_TOKEN: ${{ secrets.LULU_RELAY_CLIENT_TOKEN }}
        run: |
          $installer = "app/dist/Lulu-Finity-Setup-0.28.1.exe"
          $zip = "app/dist/Lulu-Finity-0.28.1-x64.zip"
          $latest = "app/dist/latest.yml"
          $blockmap = "app/dist/Lulu-Finity-Setup-0.28.1.exe.blockmap"
          foreach ($file in @($installer,$zip,$latest,$blockmap,"Lulu-Finity-Source-0.28.1.zip")) { if (!(Test-Path $file)) { throw "No se generó $file" } }
          Expand-Archive $zip -DestinationPath verify-portable -Force
          $asar = Get-ChildItem verify-portable -Recurse -Filter app.asar | Select-Object -First 1
          if (!$asar) { throw "No se encontró app.asar." }
          $asarText = [Text.Encoding]::UTF8.GetString([IO.File]::ReadAllBytes($asar.FullName))
          foreach ($token in @("async function connectFromUi()","async function skipCurrentSong()","function setupEvents()","v0.28.1")) { if (!$asarText.Contains($token)) { throw "El app.asar final no contiene $token" } }
          if ($asarText.Contains("__LULU_RELAY_CLIENT_TOKEN__") -or !$asarText.Contains($env:LULU_RELAY_CLIENT_TOKEN)) { throw "Token del relay inválido en app.asar." }
          if ($asarText.Contains("app.getPath('localAppData')") -or $asarText.Contains('app.getPath("localAppData")')) { throw "Regresó LocalAppData." }
          $tag = "v0.28.1"
          $files = @($installer,$zip,$latest,$blockmap,"Lulu-Finity-Source-0.28.1.zip")
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { gh release upload $tag $files --clobber; gh release edit $tag --title "Lulu Finity 0.28.1" --notes-file "app/CHANGELOG.md" }
          else { gh release create $tag $files --target main --title "Lulu Finity 0.28.1" --notes-file "app/CHANGELOG.md" }
      - uses: actions/upload-artifact@v4
        with:
          name: Lulu-Finity-Windows-v0.28.1
          path: |
            app/dist/Lulu-Finity-Setup-0.28.1.exe
            app/dist/Lulu-Finity-0.28.1-x64.zip
            app/dist/latest.yml
            app/dist/Lulu-Finity-Setup-0.28.1.exe.blockmap
            Lulu-Finity-Source-0.28.1.zip
          if-no-files-found: error
          retention-days: 30
