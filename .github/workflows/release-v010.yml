name: Publicar Lulu Finity 0.10.0

on:
  push:
    branches: [main]
    paths:
      - "build-v010/**"
      - ".github/workflows/release-v010.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Descargar base oficial 0.9.0
        shell: pwsh
        run: |
          $url = "https://github.com/Mikasita25/Lulu-Finity/releases/download/v0.9.0/Lulu-Finity-Source-0.9.0.zip"
          Invoke-WebRequest -Uri $url -OutFile "Lulu-Finity-Source-0.9.0.zip"
          $hash = (Get-FileHash "Lulu-Finity-Source-0.9.0.zip" -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne "dcdb757597f3de477b3114ff8bda0cebe70cd3c4902680ea919d64e6babd07e4") {
            throw "El hash de la base 0.9.0 no coincide: $hash"
          }
          Expand-Archive "Lulu-Finity-Source-0.9.0.zip" -DestinationPath "app" -Force

      - name: Reconstruir actualización 0.10.0
        shell: pwsh
        run: |
          $scriptParts = Get-ChildItem "build-v010/script/script-*.txt" | Sort-Object Name
          if ($scriptParts.Count -ne 8) {
            throw "Se esperaban 8 fragmentos del código y se encontraron $($scriptParts.Count)."
          }
          $script = ($scriptParts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ""
          [IO.File]::WriteAllText("apply-v010.py", $script, [Text.UTF8Encoding]::new($false))
          $scriptHash = (Get-FileHash "apply-v010.py" -Algorithm SHA256).Hash.ToLower()
          if ($scriptHash -ne "d31f7926e417545406b4de1eb873e183a510e14b2654ac7085e0a99b6a3e8625") {
            throw "El hash del código 0.10.0 no coincide: $scriptHash"
          }

          $imageParts = Get-ChildItem "build-v010/image2/image-*.txt" | Sort-Object Name
          if ($imageParts.Count -ne 5) {
            throw "Se esperaban 5 fragmentos de imagen y se encontraron $($imageParts.Count)."
          }
          $imageBase64 = ($imageParts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ""
          [IO.File]::WriteAllBytes("app/src/lulu-about.webp", [Convert]::FromBase64String($imageBase64))
          $imageHash = (Get-FileHash "app/src/lulu-about.webp" -Algorithm SHA256).Hash.ToLower()
          if ($imageHash -ne "7e1910864bcdbfaaf2353ae2b382952ba3fe72a44f9b9dc8ab445ad2b4836abf") {
            throw "El hash de la imagen no coincide: $imageHash"
          }

          python apply-v010.py app

      - name: Validar aplicación
        shell: pwsh
        working-directory: app
        run: |
          node --check src/main.js
          node --check src/preload.js
          node --check src/renderer.js
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          if ($package.version -ne "0.10.0") { throw "Versión inesperada: $($package.version)" }
          if ($package.build.win.requestedExecutionLevel -ne "asInvoker") { throw "La aplicación solicita elevación." }
          if ($package.build.nsis.perMachine -ne $false -or $package.build.nsis.allowElevation -ne $false) {
            throw "El instalador no está configurado por usuario."
          }
          $main = Get-Content src/main.js -Raw
          $preload = Get-Content src/preload.js -Raw
          $renderer = Get-Content src/renderer.js -Raw
          foreach ($token in @("WebcastEvent.GIFT", "WebcastEvent.FOLLOW", "WebcastEvent.LIKE", "live:event", "function createSpotifyWindow")) {
            if (!$main.Contains($token)) { throw "Falta $token en main.js" }
          }
          foreach ($token in @("openSpotify", "onLiveEvent", "onSpotifyPlayer")) {
            if (!$preload.Contains($token)) { throw "Falta $token en preload.js" }
          }
          foreach ($token in @("page-events", "page-spotify", "page-about", "Luluvcupidx", "!spotify")) {
            if (!$renderer.Contains($token)) { throw "Falta $token en renderer.js" }
          }
          if (!(Test-Path src/lulu-about.webp)) { throw "Falta la imagen Sobre Lulu." }

      - name: Preparar código fuente
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "source-v010" -Force | Out-Null
          foreach ($file in @("package.json", "NOTICE.md", "README.md", "CHANGELOG.md", ".gitignore")) {
            if (Test-Path "app/$file") { Copy-Item "app/$file" "source-v010/$file" -Force }
          }
          foreach ($folder in @("src", "build", ".github")) {
            if (Test-Path "app/$folder") { Copy-Item "app/$folder" "source-v010/$folder" -Recurse -Force }
          }
          Compress-Archive -Path "source-v010/*" -DestinationPath "Lulu-Finity-Source-0.10.0.zip" -Force

      - name: Instalar dependencias
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: Compilar instalador, ZIP y actualizador
        working-directory: app
        run: npm run build:win -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Verificar archivos y analizar con Defender
        shell: pwsh
        run: |
          $installer = "app/dist/Lulu-Finity-Setup-0.10.0.exe"
          $zip = "app/dist/Lulu-Finity-0.10.0-x64.zip"
          $latest = "app/dist/latest.yml"
          $blockmap = "app/dist/Lulu-Finity-Setup-0.10.0.exe.blockmap"
          foreach ($file in @($installer, $zip, $latest, $blockmap, "Lulu-Finity-Source-0.10.0.zip")) {
            if (!(Test-Path $file)) { throw "No se generó $file" }
          }
          if ((Get-Item $installer).Length -lt 50000000) { throw "El instalador parece incompleto." }
          if ((Get-Item $zip).Length -lt 50000000) { throw "El ZIP parece incompleto." }
          try {
            Start-MpScan -ScanType CustomScan -ScanPath (Resolve-Path $installer) -ErrorAction Stop
            Start-MpScan -ScanType CustomScan -ScanPath (Resolve-Path $zip) -ErrorAction Stop
            $recent = Get-MpThreatDetection -ErrorAction SilentlyContinue | Where-Object { $_.InitialDetectionTime -gt (Get-Date).AddMinutes(-15) }
            if ($recent) { throw "Microsoft Defender reportó una detección." }
            Write-Host "Microsoft Defender no reportó detecciones."
          } catch {
            if ($_.Exception.Message -like '*reportó una detección*') { throw }
            Write-Warning "Defender no pudo ejecutarse: $($_.Exception.Message)"
          }

      - name: Publicar Release v0.10.0
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v0.10.0"
          $files = @(
            "app/dist/Lulu-Finity-Setup-0.10.0.exe",
            "app/dist/Lulu-Finity-0.10.0-x64.zip",
            "app/dist/latest.yml",
            "app/dist/Lulu-Finity-Setup-0.10.0.exe.blockmap",
            "Lulu-Finity-Source-0.10.0.zip"
          ) | Where-Object { Test-Path $_ }
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $files --clobber
            gh release edit $tag --title "Lulu Finity 0.10.0" --notes-file "app/CHANGELOG.md"
          } else {
            gh release create $tag $files --target main --title "Lulu Finity 0.10.0" --notes-file "app/CHANGELOG.md"
          }

      - name: Subir artefacto de Windows
        uses: actions/upload-artifact@v4
        with:
          name: Lulu-Finity-Windows-v0.10.0
          path: |
            app/dist/Lulu-Finity-Setup-0.10.0.exe
            app/dist/Lulu-Finity-0.10.0-x64.zip
            app/dist/latest.yml
            app/dist/Lulu-Finity-Setup-0.10.0.exe.blockmap
            Lulu-Finity-Source-0.10.0.zip
          if-no-files-found: error
          retention-days: 30
