name: Publicar Lulu Finity 0.10.0

on:
  push:
    branches: [main]
    paths:
      - "build-v010/**"
      - ".github/workflows/release-v010.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reconstruir y validar 0.10.0
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/Mikasita25/Lulu-Finity/releases/download/v0.9.0/Lulu-Finity-Source-0.9.0.zip" -OutFile base.zip
          $baseHash = (Get-FileHash base.zip -Algorithm SHA256).Hash.ToLower()
          if ($baseHash -ne "dcdb757597f3de477b3114ff8bda0cebe70cd3c4902680ea919d64e6babd07e4") { throw "Base incorrecta: $baseHash" }
          Expand-Archive base.zip -DestinationPath app -Force

          $scripts = Get-ChildItem "build-v010/script/script-*.txt" | Sort-Object Name
          if ($scripts.Count -ne 8) { throw "Se esperaban 8 fragmentos de código." }
          $script = ($scripts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ""
          [IO.File]::WriteAllText("apply-v010.py", $script, [Text.UTF8Encoding]::new($false))
          $scriptHash = (Get-FileHash apply-v010.py -Algorithm SHA256).Hash.ToLower()
          if ($scriptHash -ne "1919485448489d2fec501ae08803b571562aa3ba985880b104719275aab0795f") { throw "Código incorrecto: $scriptHash" }

          $images = Get-ChildItem "build-v010/image2/image-*.txt" | Sort-Object Name
          if ($images.Count -ne 5) { throw "Se esperaban 5 fragmentos de imagen." }
          $image64 = ($images | ForEach-Object { Get-Content $_.FullName -Raw }) -join ""
          [IO.File]::WriteAllBytes("app/src/lulu-about.webp", [Convert]::FromBase64String($image64))
          $imageHash = (Get-FileHash "app/src/lulu-about.webp" -Algorithm SHA256).Hash.ToLower()
          if ($imageHash -ne "b6e32cbae322d502b5265dc39365d717eb834d639fc2d0e32704f8659ce5acae") { throw "Imagen incorrecta: $imageHash" }

          python -X utf8 apply-v010.py app
          if ($LASTEXITCODE -ne 0) { throw "No se pudo aplicar la actualización 0.10.0." }
          node --check app/src/main.js
          node --check app/src/preload.js
          node --check app/src/renderer.js
          $package = Get-Content app/package.json -Raw | ConvertFrom-Json
          if ($package.version -ne "0.10.0") { throw "Versión inesperada." }
          if ($package.build.win.requestedExecutionLevel -ne "asInvoker") { throw "Solicita administrador." }
          $main = Get-Content app/src/main.js -Raw
          $preload = Get-Content app/src/preload.js -Raw
          $renderer = Get-Content app/src/renderer.js -Raw
          foreach ($token in @("WebcastEvent.GIFT","WebcastEvent.FOLLOW","WebcastEvent.LIKE","live:event","function createSpotifyWindow")) { if (!$main.Contains($token)) { throw "Falta $token" } }
          foreach ($token in @("openSpotify","onLiveEvent","onSpotifyPlayer")) { if (!$preload.Contains($token)) { throw "Falta $token" } }
          foreach ($token in @("page-events","page-spotify","page-about","Luluvcupidx","!spotify")) { if (!$renderer.Contains($token)) { throw "Falta $token" } }

          New-Item -ItemType Directory source-v010 -Force | Out-Null
          foreach ($file in @("package.json","NOTICE.md","README.md","CHANGELOG.md",".gitignore")) { if (Test-Path "app/$file") { Copy-Item "app/$file" "source-v010/$file" -Force } }
          foreach ($folder in @("src","build",".github")) { if (Test-Path "app/$folder") { Copy-Item "app/$folder" "source-v010/$folder" -Recurse -Force } }
          Compress-Archive -Path "source-v010/*" -DestinationPath "Lulu-Finity-Source-0.10.0.zip" -Force

      - name: Instalar dependencias
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: Compilar Windows
        working-directory: app
        run: npm run build:win -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Verificar y analizar
        shell: pwsh
        run: |
          $installer = "app/dist/Lulu-Finity-Setup-0.10.0.exe"
          $zip = "app/dist/Lulu-Finity-0.10.0-x64.zip"
          $latest = "app/dist/latest.yml"
          $blockmap = "app/dist/Lulu-Finity-Setup-0.10.0.exe.blockmap"
          foreach ($file in @($installer,$zip,$latest,$blockmap,"Lulu-Finity-Source-0.10.0.zip")) { if (!(Test-Path $file)) { throw "No se generó $file" } }
          if ((Get-Item $installer).Length -lt 50000000 -or (Get-Item $zip).Length -lt 50000000) { throw "Paquete incompleto." }
          try {
            Start-MpScan -ScanType CustomScan -ScanPath (Resolve-Path $installer) -ErrorAction Stop
            Start-MpScan -ScanType CustomScan -ScanPath (Resolve-Path $zip) -ErrorAction Stop
            $recent = Get-MpThreatDetection -ErrorAction SilentlyContinue | Where-Object { $_.InitialDetectionTime -gt (Get-Date).AddMinutes(-15) }
            if ($recent) { throw "Microsoft Defender reportó una detección." }
          } catch { if ($_.Exception.Message -like '*reportó una detección*') { throw }; Write-Warning $_.Exception.Message }

      - name: Publicar Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v0.10.0"
          $files = @("app/dist/Lulu-Finity-Setup-0.10.0.exe","app/dist/Lulu-Finity-0.10.0-x64.zip","app/dist/latest.yml","app/dist/Lulu-Finity-Setup-0.10.0.exe.blockmap","Lulu-Finity-Source-0.10.0.zip")
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { gh release upload $tag $files --clobber; gh release edit $tag --title "Lulu Finity 0.10.0" --notes-file "app/CHANGELOG.md" }
          else { gh release create $tag $files --target main --title "Lulu Finity 0.10.0" --notes-file "app/CHANGELOG.md" }

      - uses: actions/upload-artifact@v4
        with:
          name: Lulu-Finity-Windows-v0.10.0
          path: |
            app/dist/Lulu-Finity-Setup-0.10.0.exe
            app/dist/Lulu-Finity-0.10.0-x64.zip
            app/dist/latest.yml
            app/dist/Lulu-Finity-Setup-0.10.0.exe.blockmap
            Lulu-Finity-Source-0.10.0.zip
          if-no-files-found: error
          retention-days: 30
