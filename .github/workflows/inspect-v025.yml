name: Inspeccionar fuente 0.24 para 0.25
on:
  push:
    branches: [agent/v025-final]
    paths: [".github/workflows/inspect-v025.yml"]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar fuente 0.24.0
        run: |
          curl -fL https://github.com/Mikasita25/Lulu-Finity/releases/download/v0.24.0/Lulu-Finity-Source-0.24.0.zip -o base.zip
          unzip -q base.zip -d app
      - name: Mostrar rangos relevantes
        run: |
          echo '=== HTML 18-310 ==='
          nl -ba app/src/index.html | sed -n '18,310p'
          echo '=== renderer inject/navigation 190-280 ==='
          nl -ba app/src/renderer.js | sed -n '190,280p'
          echo '=== renderer theme/settings 760-810 ==='
          nl -ba app/src/renderer.js | sed -n '760,810p'
          echo '=== renderer populate/save/bind 1080-1210 ==='
          nl -ba app/src/renderer.js | sed -n '1080,1210p'
          echo '=== renderer events near end ==='
          nl -ba app/src/renderer.js | sed -n '2300,2550p'
          echo '=== main defaults ==='
          grep -nEi 'DEFAULT_SETTINGS|themeMode|panelOpacity|tiktokAutoChat|musicProvider|username' app/src/main.js | head -n 220 || true
