name: Validar mensajes automáticos 0.23

on:
  pull_request:
    paths:
      - "build-v023/**"
      - ".github/workflows/validate-v023.yml"
      - ".github/workflows/release-v023.yml"
  push:
    branches: [main]
    paths:
      - "build-v023/**"
      - ".github/workflows/validate-v023.yml"
      - ".github/workflows/release-v023.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reconstruir Lulu Finity 0.23.0
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/Mikasita25/Lulu-Finity/releases/download/v0.22.0/Lulu-Finity-Source-0.22.0.zip \
            --output base.zip
          echo "894c92bd3b59743b91c4ae18e50e4ff29e929cb04d78a3acf8ce5517de655138  base.zip" | sha256sum --check
          unzip -q base.zip -d app
          test "$(find build-v023/script -maxdepth 1 -name 'part-*.txt' | wc -l)" -eq 1
          cat build-v023/script/part-*.txt > apply-v023.b64
          python - <<'PY'
          import base64, gzip, pathlib
          encoded = pathlib.Path('apply-v023.b64').read_text(encoding='ascii')
          pathlib.Path('apply-v023.py').write_bytes(gzip.decompress(base64.b64decode(encoded)))
          PY
          echo "b919fef8a2da03131229f8862cc96927b3ce6b7cfe7a688d24252a2667e418c7  apply-v023.py" | sha256sum --check
          python apply-v023.py app

      - name: Validar aplicación reconstruida
        run: |
          node --check app/src/main.js
          node --check app/src/preload.js
          node --check app/src/renderer.js
          node -e "const p=require('./app/package.json'); if(p.version!=='0.23.0'||p.dependencies.ws!=='8.18.2') process.exit(1)"
          python - <<'PY'
          from pathlib import Path
          main = Path('app/src/main.js').read_text(encoding='utf-8')
          preload = Path('app/src/preload.js').read_text(encoding='utf-8')
          renderer = Path('app/src/renderer.js').read_text(encoding='utf-8')
          html = Path('app/src/index.html').read_text(encoding='utf-8')
          css = Path('app/src/styles.css').read_text(encoding='utf-8')
          for token in ('TIKTOK_CHAT_PARTITION', 'sendTikTokChatMessage', 'tiktok-chat:send', 'tiktokChatTarget', '__LULU_RELAY_CLIENT_TOKEN__'):
              assert token in main, token
          for token in ('openTikTokChat', 'sendTikTokChat', 'onTikTokChatStatus'):
              assert token in preload, token
          for token in ('sendTikTokAutoChatEvent', 'tiktokAutoChatSongStartedText', 'formatTikTokAutoChat'):
              assert token in renderer, token
          for token in ('Mensajes automáticos en el LIVE', 'tiktokAutoChatSongQueuedTextInput', 'testTikTokChatBtn'):
              assert token in html, token
          assert '.auto-chat-rules' in css
          assert "relayClientToken === '__LULU_RELAY_CLIENT_TOKEN__'" not in main
          assert "relayClientToken.startsWith('__LULU_RELAY_')" in main
          PY
