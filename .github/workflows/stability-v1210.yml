name: Lulu Finity 1.2.1

on:
  workflow_dispatch:
  push:
    branches: [fix/pc-stability-1.2.1]
    paths:
      - "build-v1210/**"
      - ".github/workflows/stability-v1210.yml"

permissions:
  contents: write

env:
  BASE_URL: https://github.com/Mikasita25/Lulu-Finity/releases/download/v1.2.0/Lulu-Finity-Source-1.2.0.zip
  BASE_SHA256: 73b3b3a5d3132072cc5b02f97135cdd9556f80dd9e5414cc691d66d69779ef65

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verificar servidor LIVE público
        run: node build-v1200/check-public-relay.cjs

      - name: Reconstruir Lulu Finity Studio 1.2.1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          Invoke-WebRequest $env:BASE_URL -OutFile base.zip
          if ((Get-FileHash base.zip -Algorithm SHA256).Hash.ToLower() -ne $env:BASE_SHA256) { throw 'La fuente 1.2.0 no coincide con el SHA-256 publicado' }
          Expand-Archive base.zip app
          python build-v1210/apply-v1210.py app
          python build-v1210/test-v1210.py app
          node --check app/src/main.js
          node --check app/src/preload.js
          node --check app/src/renderer.js
          node --check app/src/music-recovery-policy.js
          node --check app/src/command-matching-policy.js
          Compress-Archive app/* Lulu-Finity-Source-1.2.1.zip

      - name: Probar y compilar Windows
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          Set-Location app
          npm ci --no-audit --no-fund
          npm test
          npm ci --prefix railway-relay --no-audit --no-fund
          npm test --prefix railway-relay
          npm run build:win -- --publish never

      - name: Probar arranque real y navegación
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $profile = Join-Path $env:RUNNER_TEMP 'lulu-v121-profile'
          $env:LULU_STARTUP_SMOKE_MARKER = Join-Path $env:RUNNER_TEMP 'lulu-v121-ready.txt'
          $env:LULU_NAVIGATION_SMOKE_MARKER = Join-Path $env:RUNNER_TEMP 'lulu-v121-navigation.json'
          New-Item -ItemType Directory $profile -Force | Out-Null
          Remove-Item $env:LULU_STARTUP_SMOKE_MARKER,$env:LULU_NAVIGATION_SMOKE_MARKER -Force -ErrorAction SilentlyContinue
          $exe = Resolve-Path 'app/dist/win-unpacked/Lulu Finity.exe'
          $process = Start-Process -FilePath $exe -ArgumentList "--user-data-dir=$profile" -PassThru
          try {
            for ($i=0;$i -lt 120;$i++) {
              Start-Sleep -Milliseconds 500
              $process.Refresh()
              if ($process.HasExited) { throw "Lulu Finity se cerró durante el arranque: $($process.ExitCode)" }
              if ((Test-Path $env:LULU_STARTUP_SMOKE_MARKER) -and (Test-Path $env:LULU_NAVIGATION_SMOKE_MARKER)) { break }
            }
            if (!(Test-Path $env:LULU_STARTUP_SMOKE_MARKER)) { throw 'La interfaz no confirmó el arranque' }
            if ((Get-Content $env:LULU_STARTUP_SMOKE_MARKER -Raw).Trim() -ne 'ready') { throw 'Marca de arranque inválida' }
            $result = Get-Content $env:LULU_NAVIGATION_SMOKE_MARKER -Raw | ConvertFrom-Json
            if (!$result.ok -or $result.results.Count -lt 12 -or $result.widgetEditors.count -ne 6) { throw "Navegación o editores fallaron: $($result | ConvertTo-Json -Depth 8 -Compress)" }
          } finally {
            Stop-Process -Name 'Lulu Finity' -Force -ErrorAction SilentlyContinue
          }

      - name: Verificar binarios y crear checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = 'app/dist/Lulu-Finity-Setup-1.2.1.exe'
          $zip = 'app/dist/Lulu-Finity-1.2.1-x64.zip'
          $latest = 'app/dist/latest.yml'
          $blockmap = 'app/dist/Lulu-Finity-Setup-1.2.1.exe.blockmap'
          $source = 'Lulu-Finity-Source-1.2.1.zip'
          $files = @($installer,$zip,$latest,$blockmap,$source)
          foreach ($file in $files) { if (!(Test-Path $file)) { throw "No se generó $file" } }
          Expand-Archive $zip verify-v121 -Force
          $asar = Get-ChildItem verify-v121 -Recurse -Filter app.asar | Select-Object -First 1
          if (!$asar) { throw 'Falta app.asar' }
          $text = [Text.Encoding]::UTF8.GetString([IO.File]::ReadAllBytes($asar.FullName))
          foreach ($token in @('v1.2.1','mutationMaintenanceTimer','lastPayloadAt','railway-transport-stale','LEADING_COMMAND_BANGS','tiktok.disconnect','LuluWidgetDesign','lulu-finity-production-6b8f.up.railway.app')) {
            if (!$text.Contains($token)) { throw "app.asar no contiene $token" }
          }
          if (!$text.Contains("EMBEDDED_RELAY_CLIENT_TOKEN = ''")) { throw 'La 1.2.1 debe conservar el LIVE público sin credencial incrustada' }
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
            "$hash  $(Split-Path $file -Leaf)"
          }
          [IO.File]::WriteAllLines('SHA256SUMS.txt', $lines, [Text.UTF8Encoding]::new($false))

      - name: Publicar Lulu Finity 1.2.1
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(
            'app/dist/Lulu-Finity-Setup-1.2.1.exe',
            'app/dist/Lulu-Finity-1.2.1-x64.zip',
            'app/dist/latest.yml',
            'app/dist/Lulu-Finity-Setup-1.2.1.exe.blockmap',
            'Lulu-Finity-Source-1.2.1.zip',
            'SHA256SUMS.txt'
          )
          gh release view v1.2.1 *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload v1.2.1 $files --clobber
            gh release edit v1.2.1 --title 'Lulu Finity 1.2.1' --notes-file 'build-v1210/release-notes.md'
          } else {
            gh release create v1.2.1 $files --target $env:GITHUB_SHA --title 'Lulu Finity 1.2.1' --notes-file 'build-v1210/release-notes.md'
          }

      - uses: actions/upload-artifact@v4
        with:
          name: Lulu-Finity-Windows-v1.2.1
          path: |
            app/dist/Lulu-Finity-Setup-1.2.1.exe
            app/dist/Lulu-Finity-1.2.1-x64.zip
            app/dist/latest.yml
            app/dist/Lulu-Finity-Setup-1.2.1.exe.blockmap
            Lulu-Finity-Source-1.2.1.zip
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
