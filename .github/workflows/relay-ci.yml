name: Validar relay y parche 0.21

on:
  pull_request:
    paths:
      - "railway-relay/**"
      - "build-v021/**"
      - ".github/workflows/relay-ci.yml"
      - ".github/workflows/release-v021.yml"
  push:
    branches: [main]
    paths:
      - "railway-relay/**"
      - "build-v021/**"
      - ".github/workflows/relay-ci.yml"
      - ".github/workflows/release-v021.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Probar relay
        working-directory: railway-relay
        run: |
          npm install --no-audit --no-fund
          npm run check
          npm test

      - name: Reconstruir parche 0.21
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/Mikasita25/Lulu-Finity/releases/download/v0.20.0/Lulu-Finity-Source-0.20.0.zip \
            --output base.zip
          echo "c9e09583d7a328bff04106a61ef954477651a69d969f421f9ba9d726febc161c  base.zip" | sha256sum --check
          unzip -q base.zip -d app
          test "$(find build-v021/script -maxdepth 1 -name 'part-*.txt' | wc -l)" -eq 10
          cat build-v021/script/part-*.txt > apply-v021.b64
          python - <<'PY'
          import base64, gzip, pathlib
          encoded = pathlib.Path('apply-v021.b64').read_text(encoding='ascii')
          pathlib.Path('apply-v021.py').write_bytes(gzip.decompress(base64.b64decode(encoded)))
          PY
          echo "59a9f72a3654602a4037e4667365dc58625c1b8b018a444d530ed3acbd0b21fd  apply-v021.py" | sha256sum --check
          python apply-v021.py app

      - name: Validar aplicación reconstruida
        run: |
          node --check app/src/main.js
          node --check app/src/preload.js
          node --check app/src/renderer.js
          node -e "const p=require('./app/package.json'); if(p.version!=='0.21.0'||p.dependencies.ws!=='8.18.2') process.exit(1)"
          python - <<'PY'
          from pathlib import Path
          main = Path('app/src/main.js').read_text(encoding='utf-8')
          preload = Path('app/src/preload.js').read_text(encoding='utf-8')
          renderer = Path('app/src/renderer.js').read_text(encoding='utf-8')
          html = Path('app/src/index.html').read_text(encoding='utf-8')
          for token in ('RailwayRelayConnection', 'normalizeRelayWebSocketUrl', 'relayUrl', 'relayClientToken', 'lulu.relay.status'):
              assert token in main, token
          for token in ('relayUrlInput', 'relayClientTokenInput', 'toggleRelayTokenBtn'):
              assert token in renderer, token
          for token in ('Servidor seguro de TikTok LIVE', 'relayUrlInput', 'relayClientTokenInput'):
              assert token in html, token
          combined = main + preload + renderer
          for forbidden in ('EULER_CLOUD_WEBSOCKET_URL', 'openFreeTikTokKey', 'new FreeEulerCloudConnection'):
              assert forbidden not in combined, forbidden
          PY
