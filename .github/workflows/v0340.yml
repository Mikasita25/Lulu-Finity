name: Lulu Finity 0.34.0

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "build-v0340/**"
      - ".github/workflows/v0340.yml"
  push:
    branches: [main]
    paths:
      - "build-v0340/**"
      - ".github/workflows/v0340.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Descargar fuente 0.33.0
        run: |
          curl --fail --location --silent --show-error https://github.com/Mikasita25/Lulu-Finity/releases/download/v0.33.0/Lulu-Finity-Source-0.33.0.zip -o base.zip
          echo "5a797f12b41ffd10ab0af3b4a27326a616c6ac691c7c99874a629d8010cb0eaa  base.zip" | sha256sum --check
          unzip -q base.zip -d app
      - name: Aplicar Lulu Studio 0.34.0
        run: python build-v0340/apply-v0340.py app
      - name: Validar sintaxis y tema
        run: |
          node --check app/src/main.js
          node --check app/src/preload.js
          node --check app/src/renderer.js
          node --check app/src/live-games.js
          node --check app/src/automation-engine.js
          python build-v0340/test-studio-theme.py app
          node build-v0320/test-live-games.js app/src/live-games.js
          node build-v0330/test-automation-engine.js app/src/automation-engine.js
      - name: Validar dependencias y relay
        run: |
          cd app
          npm install --ignore-scripts --no-audit --no-fund
          npm ls @ghostery/adblocker-electron edge-tts-universal --depth=0
          cd railway-relay
          npm test
      - name: Regresiones de interfaz
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          h=Path('app/src/index.html').read_text(encoding='utf-8')
          r=Path('app/src/renderer.js').read_text(encoding='utf-8')
          s=Path('app/src/styles.css').read_text(encoding='utf-8')
          p=json.loads(Path('app/package.json').read_text(encoding='utf-8'))
          assert p['version']=='0.34.0'
          for token in ('Voz TTS','Música','Automatizaciones','Juegos del LIVE','Economía'):
              assert token in h, token
          for token in ('renderStudioDashboard','studioThemeInfo','studioConnectBtn','data-studio-theme'):
              assert token in r or token in h, token
          for theme in ('studio-lavender','studio-pink','studio-mint'):
              assert theme in h and theme in r and theme in s
          for asset in ('miku-dark-user.png','miku-soft-user.png','miku-classic-user.jpg'):
              assert (Path('app/src')/asset).stat().st_size > 100_000
          assert '<span class="version" id="versionLabel">v0.34.0</span>' in h
          PY

  release:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reconstruir 0.34.0
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          Invoke-WebRequest -Uri "https://github.com/Mikasita25/Lulu-Finity/releases/download/v0.33.0/Lulu-Finity-Source-0.33.0.zip" -OutFile base.zip
          if ((Get-FileHash base.zip -Algorithm SHA256).Hash.ToLower() -ne "5a797f12b41ffd10ab0af3b4a27326a616c6ac691c7c99874a629d8010cb0eaa") { throw "Fuente 0.33.0 incorrecta" }
          Expand-Archive base.zip -DestinationPath app -Force
          python build-v0340/apply-v0340.py app
          node --check app/src/main.js
          node --check app/src/preload.js
          node --check app/src/renderer.js
          python build-v0340/test-studio-theme.py app
          node build-v0320/test-live-games.js app/src/live-games.js
          node build-v0330/test-automation-engine.js app/src/automation-engine.js
          Push-Location app/railway-relay; npm test; if ($LASTEXITCODE -ne 0) { throw "Falló relay" }; Pop-Location
          New-Item -ItemType Directory source-v0340 -Force | Out-Null
          foreach ($file in @("package.json","NOTICE.md","README.md","CHANGELOG.md",".gitignore")) { if (Test-Path "app/$file") { Copy-Item "app/$file" "source-v0340/$file" -Force } }
          foreach ($folder in @("src","build","railway-relay")) { if (Test-Path "app/$folder") { Copy-Item "app/$folder" "source-v0340/$folder" -Recurse -Force } }
          Compress-Archive -Path "source-v0340/*" -DestinationPath "Lulu-Finity-Source-0.34.0.zip" -Force
      - name: Inyectar token oficial del relay
        shell: pwsh
        env:
          LULU_RELAY_CLIENT_TOKEN: ${{ secrets.LULU_RELAY_CLIENT_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:LULU_RELAY_CLIENT_TOKEN) -or $env:LULU_RELAY_CLIENT_TOKEN.Length -lt 32) { throw "Token inválido" }
          $path = "app/src/main.js"
          $content = Get-Content $path -Raw
          if (!$content.Contains("__LULU_RELAY_CLIENT_TOKEN__")) { throw "Falta marcador" }
          $content = $content.Replace("__LULU_RELAY_CLIENT_TOKEN__", $env:LULU_RELAY_CLIENT_TOKEN)
          [IO.File]::WriteAllText($path, $content, [Text.UTF8Encoding]::new($false))
      - name: Compilar Windows
        working-directory: app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          npm install --no-audit --no-fund
          npm run build:win -- --publish never
      - name: Verificar y publicar 0.34.0
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          LULU_RELAY_CLIENT_TOKEN: ${{ secrets.LULU_RELAY_CLIENT_TOKEN }}
        run: |
          $installer = "app/dist/Lulu-Finity-Setup-0.34.0.exe"
          $zip = "app/dist/Lulu-Finity-0.34.0-x64.zip"
          $latest = "app/dist/latest.yml"
          $blockmap = "app/dist/Lulu-Finity-Setup-0.34.0.exe.blockmap"
          foreach ($file in @($installer,$zip,$latest,$blockmap,"Lulu-Finity-Source-0.34.0.zip")) { if (!(Test-Path $file)) { throw "No se generó $file" } }
          Expand-Archive $zip -DestinationPath verify -Force
          $asar = Get-ChildItem verify -Recurse -Filter app.asar | Select-Object -First 1
          if (!$asar) { throw "Falta app.asar" }
          $text = [Text.Encoding]::UTF8.GetString([IO.File]::ReadAllBytes($asar.FullName))
          foreach ($token in @("studio-lavender","studioDashboard","Studio Lavanda","miku-dark-user.png","v0.34.0","Juegos del LIVE","Automatizaciones")) { if (!$text.Contains($token)) { throw "app.asar no contiene $token" } }
          if ($text.Contains("__LULU_RELAY_CLIENT_TOKEN__") -or !$text.Contains($env:LULU_RELAY_CLIENT_TOKEN)) { throw "Token inválido en asar" }
          $tag = "v0.34.0"
          $files = @($installer,$zip,$latest,$blockmap,"Lulu-Finity-Source-0.34.0.zip")
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { gh release upload $tag $files --clobber; gh release edit $tag --title "Lulu Finity 0.34.0" --notes-file "app/CHANGELOG.md" }
          else { gh release create $tag $files --target main --title "Lulu Finity 0.34.0" --notes-file "app/CHANGELOG.md" }
      - uses: actions/upload-artifact@v4
        with:
          name: Lulu-Finity-Windows-v0.34.0
          path: |
            app/dist/Lulu-Finity-Setup-0.34.0.exe
            app/dist/Lulu-Finity-0.34.0-x64.zip
            app/dist/latest.yml
            app/dist/Lulu-Finity-Setup-0.34.0.exe.blockmap
            Lulu-Finity-Source-0.34.0.zip
          if-no-files-found: error
          retention-days: 30
