name: Lulu Finity 1.1.2

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "build-v1120/**"
      - "railway-relay/**"
      - ".github/workflows/v1120.yml"
  push:
    branches: [main]
    paths:
      - "build-v1120/**"
      - "railway-relay/**"
      - ".github/workflows/v1120.yml"

permissions:
  contents: write

env:
  BASE_URL: https://github.com/Mikasita25/Lulu-Finity/releases/download/v1.1.1/Lulu-Finity-Source-1.1.1.zip
  BASE_SHA256: 8c66a6af88bc2cd4b91631eb8369014dc8e4b3877eeca38ced844ea1813d3f61
  CLOUDFLARED_VERSION: 2026.8.2
  CLOUDFLARED_SHA256: c29eee2b121f5436a642eed69fd9767da7e7b8c510fa50aaa130337f931357b5

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reconstruir fuente oficial 1.1.2
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error "$BASE_URL" -o base.zip
          echo "$BASE_SHA256  base.zip" | sha256sum --check
          unzip -q base.zip -d app
          python build-v1120/apply-v1120.py app
          python build-v1120/test-v1120.py app
      - name: Probar Lulu Finity PC
        run: |
          set -euo pipefail
          node --check app/src/main.js
          node --check app/src/preload.js
          node --check app/src/renderer.js
          cd app
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          cd railway-relay
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
          npm test
      - name: Probar relay de producción y HTTPS estable
        run: |
          set -euo pipefail
          cd railway-relay
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
          npm test
          state_dir="$(mktemp -d)"
          cleanup() { kill "$relay_pid" 2>/dev/null || true; rm -rf "$state_dir"; }
          trap cleanup EXIT
          PORT=31847 EULER_API_KEYS=fake-key OVERLAY_STATE_DIR="$state_dir" npm start >relay.log 2>&1 &
          relay_pid=$!
          for attempt in $(seq 1 40); do curl --fail --silent http://127.0.0.1:31847/health >/dev/null && break; sleep .25; done
          secret="$(printf 'ab%.0s' {1..32})"
          public_id="$(node -e "process.stdout.write(require('crypto').createHash('sha256').update(process.argv[1]).digest('hex').slice(0,32))" "$secret")"
          curl --fail --silent --request PUT \
            --header "Authorization: Bearer $secret" --header "Content-Type: application/json" \
            --data '{"current":{"title":"Prueba HTTPS"},"queue":[]}' \
            "http://127.0.0.1:31847/v1/overlays/$public_id/sources/widget/playlist" >/dev/null
          curl --fail --silent "http://127.0.0.1:31847/overlays/$public_id/widget/playlist" | grep -q "async function poll"
          curl --fail --silent "http://127.0.0.1:31847/v1/overlays/$public_id/sources/widget/playlist" | grep -q "Prueba HTTPS"

  windows:
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reconstruir fuente 1.1.2
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          Invoke-WebRequest -Uri $env:BASE_URL -OutFile base.zip
          if ((Get-FileHash base.zip -Algorithm SHA256).Hash.ToLower() -ne $env:BASE_SHA256) { throw "Fuente 1.1.1 incorrecta" }
          Expand-Archive base.zip -DestinationPath app -Force
          python build-v1120/apply-v1120.py app
          python build-v1120/test-v1120.py app
      - name: Preparar alternativa Cloudflared verificada
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          New-Item -ItemType Directory "app/resources/tools" -Force | Out-Null
          $binary = "app/resources/tools/cloudflared.exe"
          Invoke-WebRequest -Uri "https://github.com/cloudflare/cloudflared/releases/download/$env:CLOUDFLARED_VERSION/cloudflared-windows-amd64.exe" -OutFile $binary
          if ((Get-FileHash $binary -Algorithm SHA256).Hash.ToLower() -ne $env:CLOUDFLARED_SHA256) { throw "cloudflared no coincide con el SHA-256 oficial" }
      - name: Crear fuente reproducible sin secretos
        shell: pwsh
        run: |
          New-Item -ItemType Directory source-v1120 -Force | Out-Null
          foreach ($file in @("package.json","package-lock.json","NOTICE.md","README.md","CHANGELOG.md",".gitignore")) { if (Test-Path "app/$file") { Copy-Item "app/$file" "source-v1120/$file" -Force } }
          foreach ($folder in @("src","resources","build","railway-relay")) { if (Test-Path "app/$folder") { Copy-Item "app/$folder" "source-v1120/$folder" -Recurse -Force } }
          Compress-Archive -Path "source-v1120/*" -DestinationPath "Lulu-Finity-Source-1.1.2.zip" -Force
      - name: Inyectar token oficial del relay
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          LULU_RELAY_CLIENT_TOKEN: ${{ secrets.LULU_RELAY_CLIENT_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:LULU_RELAY_CLIENT_TOKEN) -or $env:LULU_RELAY_CLIENT_TOKEN.Length -lt 32) { throw "Token inválido" }
          $path = "app/src/main.js"
          $content = Get-Content $path -Raw
          if (!$content.Contains("__LULU_RELAY_CLIENT_TOKEN__")) { throw "Falta marcador" }
          [IO.File]::WriteAllText($path, $content.Replace("__LULU_RELAY_CLIENT_TOKEN__", $env:LULU_RELAY_CLIENT_TOKEN), [Text.UTF8Encoding]::new($false))
      - name: Probar y compilar Windows
        working-directory: app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build:win -- --publish never
      - name: Probar arranque real de Windows
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $profile = Join-Path $env:RUNNER_TEMP "lulu-v112-profile"
          $startupMarker = Join-Path $env:RUNNER_TEMP "lulu-v112-startup.txt"
          $navigationMarker = Join-Path $env:RUNNER_TEMP "lulu-v112-navigation.json"
          New-Item -ItemType Directory -Path $profile -Force | Out-Null
          Remove-Item $startupMarker,$navigationMarker -Force -ErrorAction SilentlyContinue
          $env:LULU_STARTUP_SMOKE_MARKER = $startupMarker
          $env:LULU_NAVIGATION_SMOKE_MARKER = $navigationMarker
          $executable = Resolve-Path "app/dist/win-unpacked/Lulu Finity.exe"
          $process = Start-Process -FilePath $executable -ArgumentList "--user-data-dir=$profile" -PassThru
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 90; $attempt++) {
              Start-Sleep -Milliseconds 500
              $process.Refresh()
              if ($process.HasExited) { throw "Lulu Finity se cerró durante el arranque con código $($process.ExitCode)" }
              if ((Test-Path $startupMarker) -and (Test-Path $navigationMarker)) { $ready = $true; break }
            }
            if (!$ready) { throw "La interfaz no confirmó el arranque completo en 45 segundos" }
            if ((Get-Content $startupMarker -Raw).Trim() -ne "ready") { throw "La marca de arranque es inválida" }
            $navigation = Get-Content $navigationMarker -Raw | ConvertFrom-Json
            if (!$navigation.ok) { throw "Una o más categorías no cargaron: $($navigation | ConvertTo-Json -Depth 8 -Compress)" }
            if (@($navigation.results).Count -lt 12) { throw "La prueba recorrió menos categorías de las esperadas" }
            if ($navigation.previews.fallbackCount -ne 7 -or $navigation.previews.readyCount -ne 7 -or $navigation.previews.frameSources -lt 1 -or !$navigation.previews.cspAllowsLocalFrames) {
              throw "Las siete vistas previas permanentes no cargaron: $($navigation.previews | ConvertTo-Json -Compress)"
            }
          }
          finally {
            Remove-Item Env:LULU_STARTUP_SMOKE_MARKER -ErrorAction SilentlyContinue
            Remove-Item Env:LULU_NAVIGATION_SMOKE_MARKER -ErrorAction SilentlyContinue
            Stop-Process -Name "Lulu Finity" -Force -ErrorAction SilentlyContinue
          }
      - name: Verificar y publicar Lulu Finity 1.1.2
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          LULU_RELAY_CLIENT_TOKEN: ${{ secrets.LULU_RELAY_CLIENT_TOKEN }}
        run: |
          $installer = "app/dist/Lulu-Finity-Setup-1.1.2.exe"
          $zip = "app/dist/Lulu-Finity-1.1.2-x64.zip"
          $latest = "app/dist/latest.yml"
          $blockmap = "app/dist/Lulu-Finity-Setup-1.1.2.exe.blockmap"
          $source = "Lulu-Finity-Source-1.1.2.zip"
          $files = @($installer,$zip,$latest,$blockmap,$source)
          foreach ($file in $files) { if (!(Test-Path $file)) { throw "No se generó $file" } }
          Expand-Archive $zip -DestinationPath verify-v112 -Force
          $asar = Get-ChildItem verify-v112 -Recurse -Filter app.asar | Select-Object -First 1
          if (!$asar) { throw "Falta app.asar" }
          $text = [Text.Encoding]::UTF8.GetString([IO.File]::ReadAllBytes($asar.FullName))
          foreach ($token in @("v1.1.2","release-notice-policy","installWelcomeModal","Lulu Finity está lista","Lulu Finity se actualizó","STABLE_OVERLAY_BASE_URL","music-recovery-policy")) {
            if (!$text.Contains($token)) { throw "app.asar no contiene $token" }
          }
          if ($text.Contains("__LULU_RELAY_CLIENT_TOKEN__") -or !$text.Contains($env:LULU_RELAY_CLIENT_TOKEN)) { throw "Token inválido en app.asar" }
          gh release view v1.1.2 *> $null
          if ($LASTEXITCODE -eq 0) { gh release upload v1.1.2 $files --clobber; gh release edit v1.1.2 --title "Lulu Finity 1.1.2" --notes-file "build-v1120/release-notes.md" }
          else { gh release create v1.1.2 $files --target $env:GITHUB_SHA --title "Lulu Finity 1.1.2" --notes-file "build-v1120/release-notes.md" }
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: Lulu-Finity-Windows-v1.1.2
          path: |
            app/dist/Lulu-Finity-Setup-1.1.2.exe
            app/dist/Lulu-Finity-1.1.2-x64.zip
            app/dist/latest.yml
            app/dist/Lulu-Finity-Setup-1.1.2.exe.blockmap
            Lulu-Finity-Source-1.1.2.zip
          if-no-files-found: error
          retention-days: 30
