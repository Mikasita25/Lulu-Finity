name: Publicar Lulu Finity 0.14.0

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "build-v014/**"
      - ".github/workflows/release-v014.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reconstruir y validar 0.14.0
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/Mikasita25/Lulu-Finity/releases/download/v0.13.1/Lulu-Finity-Source-0.13.1.zip" -OutFile base.zip
          $baseHash = (Get-FileHash base.zip -Algorithm SHA256).Hash.ToLower()
          if ($baseHash -ne "28d47fe3d37f5a458a44c1cdf95952bd5a1f6640e0f844d5a5cb36dc68eb49a6") {
            throw "La fuente 0.13.1 no coincide: $baseHash"
          }
          Expand-Archive base.zip -DestinationPath app -Force

          $parts = Get-ChildItem "build-v014/patch/part-*.txt" | Sort-Object Name
          if ($parts.Count -ne 13) { throw "Se esperaban 13 fragmentos y se encontraron $($parts.Count)." }
          $base64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ""
          $patch = "Lulu-Finity-Patch-0.14.0.zip"
          [IO.File]::WriteAllBytes($patch, [Convert]::FromBase64String($base64))
          $patchHash = (Get-FileHash $patch -Algorithm SHA256).Hash.ToLower()
          if ($patchHash -ne "deba9fe4816bbefce5779fa538122e51ceeb7024b5ff5c5718dce2ae6d6aec36") {
            throw "El parche 0.14.0 no coincide: $patchHash"
          }
          Expand-Archive $patch -DestinationPath app -Force

          node --check app/src/main.js
          node --check app/src/preload.js
          node --check app/src/renderer.js

          $package = Get-Content app/package.json -Raw | ConvertFrom-Json
          if ($package.version -ne "0.14.0") { throw "Versión inesperada: $($package.version)" }
          if ($package.build.win.requestedExecutionLevel -ne "asInvoker") { throw "La aplicación solicita administrador." }

          $main = Get-Content app/src/main.js -Raw
          $preload = Get-Content app/src/preload.js -Raw
          $renderer = Get-Content app/src/renderer.js -Raw
          $html = Get-Content app/src/index.html -Raw

          foreach ($token in @("WebcastEvent.EMOTE", "fanSticker", "economy:mutate", "economy.json", "extractFanStickers")) {
            if (!$main.Contains($token)) { throw "Falta $token en main.js" }
          }
          foreach ($token in @("mutateEconomy", "getEconomySnapshot")) {
            if (!$preload.Contains($token)) { throw "Falta $token en preload.js" }
          }
          foreach ($token in @("revokePendingSong", "chargeCommand", "economyRewards", "renderDetectedFanStickers", "command.action === 'balance'", "command.action === 'revoke'")) {
            if (!$renderer.Contains($token)) { throw "Falta $token en renderer.js" }
          }
          foreach ($token in @("page-economy", "commandCostInput", "detectedFanStickers", "economyRewardsList")) {
            if (!$html.Contains($token)) { throw "Falta $token en index.html" }
          }

          New-Item -ItemType Directory source-v014 -Force | Out-Null
          foreach ($file in @("package.json", "NOTICE.md", "README.md", "CHANGELOG.md", ".gitignore")) {
            if (Test-Path "app/$file") { Copy-Item "app/$file" "source-v014/$file" -Force }
          }
          foreach ($folder in @("src", "build", ".github")) {
            if (Test-Path "app/$folder") { Copy-Item "app/$folder" "source-v014/$folder" -Recurse -Force }
          }
          Compress-Archive -Path "source-v014/*" -DestinationPath "Lulu-Finity-Source-0.14.0.zip" -Force

      - name: Instalar dependencias
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: Compilar Windows
        working-directory: app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run build:win -- --publish never

      - name: Verificar y analizar
        shell: pwsh
        run: |
          $installer = "app/dist/Lulu-Finity-Setup-0.14.0.exe"
          $zip = "app/dist/Lulu-Finity-0.14.0-x64.zip"
          $latest = "app/dist/latest.yml"
          $blockmap = "app/dist/Lulu-Finity-Setup-0.14.0.exe.blockmap"
          foreach ($file in @($installer, $zip, $latest, $blockmap, "Lulu-Finity-Source-0.14.0.zip")) {
            if (!(Test-Path $file)) { throw "No se generó $file" }
          }
          if ((Get-Item $installer).Length -lt 50000000 -or (Get-Item $zip).Length -lt 50000000) {
            throw "El paquete parece incompleto."
          }
          try {
            Start-MpScan -ScanType CustomScan -ScanPath (Resolve-Path $installer) -ErrorAction Stop
            Start-MpScan -ScanType CustomScan -ScanPath (Resolve-Path $zip) -ErrorAction Stop
            $recent = Get-MpThreatDetection -ErrorAction SilentlyContinue | Where-Object { $_.InitialDetectionTime -gt (Get-Date).AddMinutes(-15) }
            if ($recent) { throw "Microsoft Defender reportó una detección." }
          } catch {
            if ($_.Exception.Message -like '*reportó una detección*') { throw }
            Write-Warning $_.Exception.Message
          }

      - name: Publicar Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v0.14.0"
          $files = @(
            "app/dist/Lulu-Finity-Setup-0.14.0.exe",
            "app/dist/Lulu-Finity-0.14.0-x64.zip",
            "app/dist/latest.yml",
            "app/dist/Lulu-Finity-Setup-0.14.0.exe.blockmap",
            "Lulu-Finity-Source-0.14.0.zip"
          )
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $files --clobber
            gh release edit $tag --title "Lulu Finity 0.14.0" --notes-file "app/CHANGELOG.md"
          } else {
            gh release create $tag $files --target main --title "Lulu Finity 0.14.0" --notes-file "app/CHANGELOG.md"
          }

      - name: Subir artefacto de Windows
        uses: actions/upload-artifact@v4
        with:
          name: Lulu-Finity-Windows-v0.14.0
          path: |
            app/dist/Lulu-Finity-Setup-0.14.0.exe
            app/dist/Lulu-Finity-0.14.0-x64.zip
            app/dist/latest.yml
            app/dist/Lulu-Finity-Setup-0.14.0.exe.blockmap
            Lulu-Finity-Source-0.14.0.zip
          if-no-files-found: error
          retention-days: 30
